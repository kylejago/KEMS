title: KEMS ROI
views:
  - title: ROI
    path: roi
    icon: mdi:finance
    type: masonry
    cards:
      - type: markdown
        content: |
          # Live ROI

          {% if is_state('binary_sensor.kems_system_installed', 'on') %}
          **Actual ROI tracking is active.** Every operational figure on this page is scoped from the selected **Financial commissioning date** onward.

          Solar used by the home counts as avoided grid-import value. Export counts only when a paid export tariff is active. Simulated battery/export gains are kept out of actual payback.
          {% else %}
          **Actual ROI tracking has not started yet.**

          Set the **Financial commissioning date** in KEMS configuration to the date the first physical part of the system became operational. Solar-only operation is enough to start ROI; this does **not** commission battery/control hardware.
          {% endif %}

          **ROI status:** {{ states('sensor.kems_roi_status') }}

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.kems_system_investment
            name: System investment
            icon: mdi:cash-multiple
          - type: tile
            entity: sensor.kems_actual_system_value_today
            name: Value created today
            icon: mdi:solar-power
          - type: tile
            entity: sensor.kems_actual_system_value_total
            name: Actual value recovered
            icon: mdi:piggy-bank
          - type: tile
            entity: sensor.kems_actual_payback_remaining
            name: Investment remaining
            icon: mdi:progress-clock

      - type: gauge
        entity: sensor.kems_actual_roi
        name: Actual investment recovered
        min: 0
        max: 100
        needle: true
        segments:
          - from: 0
            color: var(--error-color)
          - from: 35
            color: var(--warning-color)
          - from: 70
            color: var(--success-color)

      - type: entities
        title: Actual value created since commissioning
        show_header_toggle: false
        entities:
          - entity: sensor.kems_lifetime_avoided_import_value
            name: Avoided grid-import value
          - entity: sensor.kems_paid_export_income_since_commissioning
            name: Paid export income
          - entity: sensor.kems_lifetime_system_value
            name: Gross system value
          - entity: sensor.kems_system_operating_costs
            name: Operating & maintenance costs
          - entity: sensor.kems_profit_after_payback
            name: Profit after payback

      - type: markdown
        title: Actual ROI — reward-inclusive reconciliation
        content: |
          {% set gross = states('sensor.kems_lifetime_system_value') | float(none) %}
          {% set hh = states('sensor.kems_roi_happy_hour_credit') | float(none) %}
          {% set pd = states('sensor.kems_roi_power_down_bonus') | float(none) %}
          {% set total = states('sensor.kems_actual_system_value_total') | float(none) %}
          | Actual value components | Amount |
          |:--|--:|
          | Underlying system value (avoided import and observed Agile export) | {{ '£%.2f' | format(gross) if gross is not none else '—' }} |
          | + Est. Happy Hour account credits | {{ '+£%.2f' | format(hh) if hh is not none else '—' }} |
          | + Est. Power Down additional bonus | {{ '+£%.2f' | format(pd) if pd is not none else '—' }} |
          | **Actual value recovered (reward-inclusive)** | **{{ '£%.2f' | format(total) if total is not none else '—' }}** |
          {% if gross is not none and hh is not none and pd is not none and total is not none %}
          {% set residual = total - gross - hh - pd %}
          **Reconciliation:** {{ 'Matches within rounding' if residual | abs <= 0.02 else ('Review unexplained £%.2f' | format(residual | abs)) }}.
          {% else %}
          **Reconciliation:** Source evidence not complete; no missing amounts assumed.
          {% endif %}

          _Credits are estimates, potentially provisional, and are **not supplier-settled**. Normal Agile export is already in underlying value and is never re-added as Power Down income. Actual payback deducts operating costs. Predicted annual saving and predicted payback are **simulation-based**, not forecasts of future reward settlement._

      - type: entities
        title: Additional rewards included in ROI (not yet supplier-settled)
        show_header_toggle: false
        entities:
          - entity: sensor.kems_roi_happy_hour_credit
            name: Happy Hour bill credit estimates (including provisional)
          - entity: sensor.kems_roi_power_down_bonus
            name: Meter-supported Power Down bonus estimate
          - entity: sensor.kems_roi_unsettled_rewards
            name: Awaiting Octopus settlement
          - entity: sensor.kems_roi_provisional_earnings
            name: Provisional partial-meter earnings (lower-confidence)
          - entity: sensor.kems_roi_meter_supported_rewards
            name: Meter-supported reward estimates
      - type: markdown
        title: ROI reward audit — individual events
        content: |
          ROI includes witnessed provisional credits and completed meter-supported reward estimates **before Octopus settlement**. They are not supplier-confirmed payments. Partial Happy Hours include only metered minutes; unobserved minutes are unknown. Normal Agile export income is counted separately and never twice.

          {% set rows = state_attr('sensor.kems_roi_reward_audit', 'entries') or [] %}
          {% if rows %}
          | Type | Date | Event ID | Reward estimate | Meter coverage | Agile income model* | ROI status | Supplier |
          |:--|:--|:--|--:|:--|--:|:--|:--|
          {% for item in rows[:20] %}
          {% set reward = item.get('estimated_reward_pence') %}
          {% set coverage = item.get('coverage_percent') %}
          {% set agile_income = item.get('modelled_agile_export_income_pence') %}
          | {{ 'Happy Hour' if item.get('type') == 'happy_hour' else 'Power Down' }} | {{ item.get('date') or 'unknown' }} | {{ item.get('event_id') or 'not available' }} | {{ ('£%.2f' | format((reward | float(0)) / 100)) if reward is not none else 'unknown' }} | {{ ('%.1f%%' | format(coverage | float(0))) if coverage is not none else '—' }} | {{ ('£%.2f' | format((agile_income | float(0)) / 100)) if agile_income is not none else '—' }} | {{ item.get('status') or 'pending' }} | {{ item.get('supplier_status') or 'unsettled' }} |
          {% endfor %}
          *Agile export model is shown only for comparison; observed Agile export is already counted in ROI and is never added again.

          Each event's evidence source, tariff basis and confidence are available in the ROI reward audit sensor attributes and KEMS diagnostics.

          {% else %}
          No saved individual reward evidence has been reported yet.
          {% endif %}
          {% set omitted = state_attr('sensor.kems_roi_reward_audit', 'entries_omitted') | int(0) %}
          {% if omitted > 0 %}Additional historic records omitted: {{ omitted }}. Full summaries remain in KEMS diagnostics.{% endif %}
      - type: entities
        title: Actual payback
        show_header_toggle: false
        entities:
          - entity: sensor.kems_financial_commissioning_date
            name: Financial start date
          - entity: sensor.kems_system_operating_days
            name: Financial operating days
          - entity: sensor.kems_actual_roi
            name: Investment recovered
          - entity: sensor.kems_actual_payback_remaining
            name: Remaining to pay back
          - entity: sensor.kems_actual_payback_date
            name: Actual payback date
          - entity: binary_sensor.kems_system_paid_back
            name: System paid back

      - type: entities
        title: Current projection — since commissioning
        show_header_toggle: false
        entities:
          - entity: sensor.kems_predicted_annual_saving
            name: Predicted annual saving
          - entity: sensor.kems_predicted_payback
            name: Predicted payback
          - entity: sensor.kems_predicted_payback_date
            name: Predicted payback date
          - entity: sensor.kems_predicted_net_value
            name: Predicted net value
          - entity: sensor.kems_roi_confidence
            name: Projection confidence

      - type: entities
        title: Physical evidence since commissioning
        show_header_toggle: false
        entities:
          - entity: sensor.kems_solar_generation_since_commissioning
            name: Solar generated
          - entity: sensor.kems_grid_import_since_commissioning
            name: Grid imported
          - entity: sensor.kems_grid_export_since_commissioning
            name: Grid exported
          - entity: sensor.kems_house_electricity_since_commissioning
            name: House electricity

      - type: history-graph
        title: Value recovered since commissioning
        hours_to_show: 720
        entities:
          - entity: sensor.kems_lifetime_system_value
            name: Actual system value
          - entity: sensor.kems_lifetime_avoided_import_value
            name: Avoided import
          - entity: sensor.kems_paid_export_income_since_commissioning
            name: Paid export income
