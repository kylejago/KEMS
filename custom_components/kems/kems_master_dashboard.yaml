title: KEMS

views:
  - title: Home
    path: home
    icon: mdi:home-lightning-bolt
    cards:
      - type: markdown
        title: KEMS at a glance
        content: |
          # ⚡ KEMS
          **Status:** {{ states('sensor.kems_status') }}  
          **Mode:** {{ states('select.kems_operating_mode') }}  
          **Product:** {{ states('select.kems_system_type') }}  
          **Export tariff:** {{ states('select.kems_export_tariff') }}

          **Advice:** **{{ states('sensor.kems_advice') }}**  
          {{ state_attr('sensor.kems_advice', 'message') or 'KEMS is analysing your home-energy data.' }}

          KEMS has exactly two user-facing products: **Live Data** shows what the property actually did; **KEMS** shows what KEMS would have done with the configured tariff, system and strategy.

      - type: grid
        columns: 3
        square: false
        cards:
          - type: entity
            entity: sensor.kems_current_import_rate
            name: Import rate now
            icon: mdi:currency-gbp
          - type: entity
            entity: sensor.kems_next_import_rate
            name: Next import rate
            icon: mdi:clock-outline
          - type: entity
            entity: binary_sensor.kems_cheap_period_confirmed
            name: Cheap period
            icon: mdi:weather-night
          - type: entity
            entity: sensor.kems_house_load
            name: Live house load
            icon: mdi:home-lightning-bolt-outline
          - type: entity
            entity: sensor.kems_simulated_battery_state_of_charge
            name: KEMS battery SOC
            icon: mdi:battery
          - type: entity
            entity: sensor.kems_forecast_solar_tomorrow
            name: Solar tomorrow
            icon: mdi:weather-sunny

      - type: markdown
        title: Today — Live Data vs KEMS
        content: |
          {% set live_e = states('sensor.kems_observed_cost_today') | float(0) %}
          {% set kems_e = states('sensor.kems_simulated_kems_cost_today') | float(0) %}
          {% set gas = states('sensor.kems_gas_cost_today') | float(0) %}
          {% set saving = live_e - kems_e %}
          | Today | Live Data | KEMS |
          |---|---:|---:|
          | Electricity net cost | £{{ '%.2f' | format(live_e / 100) }} | £{{ '%.2f' | format(kems_e / 100) }} |
          | Gas cost | £{{ '%.2f' | format(gas / 100) }} | £{{ '%.2f' | format(gas / 100) }} |
          | **Total energy cost** | **£{{ '%.2f' | format((live_e + gas) / 100) }}** | **£{{ '%.2f' | format((kems_e + gas) / 100) }}** |
          | Grid import | {{ states('sensor.kems_observed_grid_import_today') }} kWh | {{ states('sensor.kems_simulated_grid_import_today') }} kWh |
          | Grid export | {{ states('sensor.kems_observed_grid_export_today') }} kWh | {{ states('sensor.kems_simulated_grid_export_today') }} kWh |

          **KEMS saving today:** £{{ '%.2f' | format(saving / 100) }}

      - type: markdown
        title: Current power flow
        content: |
          {% set bad = ['unknown', 'unavailable', 'none', ''] %}
          {% set live_export = states('sensor.kems_grid_export') %}
          {% set live_solar = states('sensor.kems_solar_power') %}
          {% set live_battery = states('sensor.kems_battery_power') %}
          | Flow | Live Data | KEMS |
          |---|---:|---:|
          | House load | {{ states('sensor.kems_house_load') }} kW | {{ states('sensor.kems_simulated_house_load_power') }} kW |
          | Solar | {{ '—' if live_solar | lower in bad else live_solar ~ ' kW' }} | {{ states('sensor.kems_simulated_solar_power') }} kW |
          | Grid import | {{ states('sensor.kems_grid_import') }} kW | {{ states('sensor.kems_simulated_grid_import_power') }} kW |
          | Grid export | {{ '—' if live_export | lower in bad else live_export ~ ' kW' }} | {{ states('sensor.kems_simulated_grid_export_power') }} kW |
          | Battery power | {{ '—' if live_battery | lower in bad else live_battery ~ ' kW' }} | {{ states('sensor.kems_simulated_battery_power') }} kW |
          | Battery SOC | {{ '—' if states('sensor.kems_battery_state_of_charge') | lower in bad else states('sensor.kems_battery_state_of_charge') ~ '%' }} | {{ states('sensor.kems_simulated_battery_state_of_charge') }}% |

          Live solar/battery values remain `—` until the physical system is commissioned. KEMS values are the digital twin.

  - title: Live Data
    path: live-data
    icon: mdi:flash
    cards:
      - type: markdown
        content: |
          # Live Data
          This page contains **actual property data only**. Optional solar and battery readings deliberately show `—` until real hardware is commissioned.

      - type: markdown
        title: Live now
        content: |
          {% set bad = ['unknown', 'unavailable', 'none', ''] %}
          {% set ge = states('sensor.kems_grid_export') %}
          {% set solar = states('sensor.kems_solar_power') %}
          {% set batt = states('sensor.kems_battery_power') %}
          {% set soc = states('sensor.kems_battery_state_of_charge') %}
          | Reading | Live Data |
          |---|---:|
          | House load | **{{ states('sensor.kems_house_load') }} kW** |
          | Grid import | {{ states('sensor.kems_grid_import') }} kW |
          | Grid export | {{ '—' if ge | lower in bad else ge ~ ' kW' }} |
          | Solar | {{ '—' if solar | lower in bad else solar ~ ' kW' }} |
          | Battery power | {{ '—' if batt | lower in bad else batt ~ ' kW' }} |
          | Battery SOC | {{ '—' if soc | lower in bad else soc ~ '%' }} |
          | EV connected | {{ states('binary_sensor.kems_ev_connected') }} |
          | EV power | {{ states('sensor.kems_ev_charging_power') }} kW |

      - type: markdown
        title: Live energy and cost today
        content: |
          {% set electric = states('sensor.kems_observed_cost_today') | float(0) %}
          {% set gas = states('sensor.kems_gas_cost_today') | float(0) %}
          | Metric | Live Data |
          |---|---:|
          | Whole-home energy | {{ states('sensor.kems_whole_home_energy_today') }} kWh |
          | Grid import | {{ states('sensor.kems_observed_grid_import_today') }} kWh |
          | Grid export | {{ states('sensor.kems_observed_grid_export_today') }} kWh |
          | Export income | £{{ '%.2f' | format((states('sensor.kems_observed_export_income_today') | float(0)) / 100) }} |
          | Electricity net cost | £{{ '%.2f' | format(electric / 100) }} |
          | Gas usage | {{ states('sensor.kems_gas_usage_today') }} kWh |
          | Gas cost | £{{ '%.2f' | format(gas / 100) }} |
          | **Total energy cost** | **£{{ '%.2f' | format((electric + gas) / 100) }}** |

      - type: history-graph
        title: Live power — 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.kems_house_load
            name: House load
          - entity: sensor.kems_grid_import
            name: Grid import
          - entity: sensor.kems_ev_charging_power
            name: EV charging

      - type: history-graph
        title: Live cost — 7 days
        hours_to_show: 168
        entities:
          - entity: sensor.kems_observed_cost_today
            name: Electricity
          - entity: sensor.kems_gas_cost_today
            name: Gas

  - title: KEMS
    path: kems
    icon: mdi:lightning-bolt-circle
    cards:
      - type: markdown
        content: |
          # KEMS
          This is the single KEMS digital-twin product. The internal strategy changes automatically with the configured export tariff; retired replay engines are not separate customer products.

          **System type:** {{ states('select.kems_system_type') }}  
          **Mode:** {{ states('select.kems_operating_mode') }}  
          **Export tariff:** {{ states('select.kems_export_tariff') }}

      - type: markdown
        title: KEMS power now
        content: |
          | Flow | KEMS |
          |---|---:|
          | House load | {{ states('sensor.kems_simulated_house_load_power') }} kW |
          | Solar | {{ states('sensor.kems_simulated_solar_power') }} kW |
          | Grid import | {{ states('sensor.kems_simulated_grid_import_power') }} kW |
          | Grid export | {{ states('sensor.kems_simulated_grid_export_power') }} kW |
          | Solar → battery | {{ states('sensor.kems_simulated_solar_to_battery_power') }} kW |
          | Battery charging | {{ states('sensor.kems_simulated_battery_charging_power') }} kW |
          | Battery → home | {{ states('sensor.kems_simulated_battery_to_home_power') }} kW |
          | Battery → export | {{ states('sensor.kems_simulated_battery_export_power') }} kW |
          | Battery SOC | **{{ states('sensor.kems_simulated_battery_state_of_charge') }}%** |

      - type: markdown
        title: KEMS today
        content: |
          {% set kems_e = states('sensor.kems_simulated_kems_cost_today') | float(0) %}
          {% set gas = states('sensor.kems_gas_cost_today') | float(0) %}
          | Metric | KEMS |
          |---|---:|
          | Grid import | {{ states('sensor.kems_simulated_grid_import_today') }} kWh |
          | Grid export | {{ states('sensor.kems_simulated_grid_export_today') }} kWh |
          | Solar generation | {{ states('sensor.kems_simulated_solar_generation_today') }} kWh |
          | Battery charged | {{ states('sensor.kems_simulated_battery_charge_today') }} kWh |
          | Battery → home | {{ states('sensor.kems_simulated_battery_to_home_today') }} kWh |
          | Battery export | {{ states('sensor.kems_simulated_battery_export_today') }} kWh |
          | Export income | £{{ '%.2f' | format((states('sensor.kems_simulated_export_income_today') | float(0)) / 100) }} |
          | Electricity net cost | £{{ '%.2f' | format(kems_e / 100) }} |
          | Gas cost | £{{ '%.2f' | format(gas / 100) }} |
          | **Total energy cost** | **£{{ '%.2f' | format((kems_e + gas) / 100) }}** |

      - type: markdown
        title: Forecast and reserve
        content: |
          | Planning signal | KEMS |
          |---|---:|
          | Solar tomorrow | {{ states('sensor.kems_forecast_solar_tomorrow') }} kWh |
          | House demand tomorrow | {{ states('sensor.kems_forecast_house_demand_tomorrow') }} kWh |
          | Required morning SOC | {{ states('sensor.kems_forecast_required_morning_soc') }}% |
          | Hours until next cheap period | {{ states('sensor.kems_hours_until_next_cheap_period') }} h |
          | Battery reserved for home | {{ states('sensor.kems_battery_energy_reserved_for_home') }} kWh |
          | Exportable battery energy | {{ states('sensor.kems_exportable_battery_energy_remaining') }} kWh |
          | Target battery export | {{ states('sensor.kems_target_battery_export_power') }} kW |

      - type: history-graph
        title: KEMS power — 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.kems_simulated_house_load_power
            name: House load
          - entity: sensor.kems_simulated_solar_power
            name: Solar
          - entity: sensor.kems_simulated_grid_import_power
            name: Grid import
          - entity: sensor.kems_simulated_grid_export_power
            name: Grid export
          - entity: sensor.kems_simulated_battery_power
            name: Battery

  - title: Compare
    path: compare
    icon: mdi:compare-horizontal
    cards:
      - type: markdown
        content: |
          # Live Data vs KEMS
          There are only two columns here by design: **Live Data** is what happened; **KEMS** is what KEMS would have done.

      - type: markdown
        title: Right now
        content: |
          {% set bad = ['unknown', 'unavailable', 'none', ''] %}
          {% set ge = states('sensor.kems_grid_export') %}
          {% set solar = states('sensor.kems_solar_power') %}
          {% set batt = states('sensor.kems_battery_power') %}
          {% set soc = states('sensor.kems_battery_state_of_charge') %}
          | Metric | Live Data | KEMS |
          |---|---:|---:|
          | House load | {{ states('sensor.kems_house_load') }} kW | {{ states('sensor.kems_simulated_house_load_power') }} kW |
          | Solar | {{ '—' if solar | lower in bad else solar ~ ' kW' }} | {{ states('sensor.kems_simulated_solar_power') }} kW |
          | Grid import | {{ states('sensor.kems_grid_import') }} kW | {{ states('sensor.kems_simulated_grid_import_power') }} kW |
          | Grid export | {{ '—' if ge | lower in bad else ge ~ ' kW' }} | {{ states('sensor.kems_simulated_grid_export_power') }} kW |
          | Battery power | {{ '—' if batt | lower in bad else batt ~ ' kW' }} | {{ states('sensor.kems_simulated_battery_power') }} kW |
          | Battery SOC | {{ '—' if soc | lower in bad else soc ~ '%' }} | {{ states('sensor.kems_simulated_battery_state_of_charge') }}% |

      - type: markdown
        title: Today
        content: |
          {% set live_e = states('sensor.kems_observed_cost_today') | float(0) %}
          {% set kems_e = states('sensor.kems_simulated_kems_cost_today') | float(0) %}
          {% set gas = states('sensor.kems_gas_cost_today') | float(0) %}
          | Metric | Live Data | KEMS |
          |---|---:|---:|
          | Whole-home energy | {{ states('sensor.kems_whole_home_energy_today') }} kWh | {{ states('sensor.kems_simulated_house_load_power') }} kW now |
          | Grid import | {{ states('sensor.kems_observed_grid_import_today') }} kWh | {{ states('sensor.kems_simulated_grid_import_today') }} kWh |
          | Grid export | {{ states('sensor.kems_observed_grid_export_today') }} kWh | {{ states('sensor.kems_simulated_grid_export_today') }} kWh |
          | Export income | £{{ '%.2f' | format((states('sensor.kems_observed_export_income_today') | float(0)) / 100) }} | £{{ '%.2f' | format((states('sensor.kems_simulated_export_income_today') | float(0)) / 100) }} |
          | Electricity net cost | £{{ '%.2f' | format(live_e / 100) }} | £{{ '%.2f' | format(kems_e / 100) }} |
          | Gas cost | £{{ '%.2f' | format(gas / 100) }} | £{{ '%.2f' | format(gas / 100) }} |
          | **Total energy cost** | **£{{ '%.2f' | format((live_e + gas) / 100) }}** | **£{{ '%.2f' | format((kems_e + gas) / 100) }}** |
          | **Saving** | — | **£{{ '%.2f' | format((live_e - kems_e) / 100) }}** |

      - type: history-graph
        title: Electricity cost — Live Data vs KEMS
        hours_to_show: 168
        entities:
          - entity: sensor.kems_observed_cost_today
            name: Live Data
          - entity: sensor.kems_simulated_kems_cost_today
            name: KEMS

  - title: Agile Slots
    path: agile-slots
    icon: mdi:chart-timeline-variant
    cards:
      - type: markdown
        content: |
          # Agile Slots
          Half-hour **Agile Outgoing** prices and the retained KEMS plan. This is tariff/plan information, not another KEMS product.

          {% set s = states.sensor.kems_agile_slots %}
          {% if s %}
          **Region:** {{ s.attributes.region or '—' }}  
          **Current Agile rate:** {{ s.attributes.current_rate_pence if s.attributes.current_rate_pence is not none else '—' }} p/kWh  
          **Price coverage today:** {{ s.attributes.today_count or 0 }}/{{ s.attributes.today_expected or 48 }}  
          **Tomorrow:** {{ s.attributes.tomorrow_status or 'Waiting for publication' }}
          {% else %}
          Agile slot data is not available yet.
          {% endif %}

      - type: markdown
        title: Today — half-hour slots
        content: |
          {% set slots = state_attr('sensor.kems_agile_slots', 'today_slots') or [] %}
          {% if slots %}
          | Time | Rate | Action | Grid import | Grid export | Battery export | End SOC |
          |---|---:|---|---:|---:|---:|---:|
          {% for p in slots %}
          | {{ p.get('label', '—') }} | {{ '%.2f' | format(p.get('rate_pence', 0) | float) }}p | {{ (p.get('actions') or ['—']) | join(', ') }} | {{ p.get('grid_import_kwh') if p.get('grid_import_kwh') is not none else '—' }} | {{ p.get('grid_export_kwh') if p.get('grid_export_kwh') is not none else '—' }} | {{ p.get('battery_export_kwh') if p.get('battery_export_kwh') is not none else '—' }} | {{ (p.get('ending_soc_percent') ~ '%') if p.get('ending_soc_percent') is not none else '—' }} |
          {% endfor %}
          {% else %}
          Today's Agile slots have not been loaded yet.
          {% endif %}

      - type: markdown
        title: Tomorrow — published slots
        content: |
          {% set slots = state_attr('sensor.kems_agile_slots', 'tomorrow_slots') or [] %}
          {% if slots %}
          | Time | Rate | Planned action | Grid import | Grid export | Battery export | End SOC |
          |---|---:|---|---:|---:|---:|---:|
          {% for p in slots %}
          | {{ p.get('label', '—') }} | {{ '%.2f' | format(p.get('rate_pence', 0) | float) }}p | {{ (p.get('actions') or ['—']) | join(', ') }} | {{ p.get('grid_import_kwh') if p.get('grid_import_kwh') is not none else '—' }} | {{ p.get('grid_export_kwh') if p.get('grid_export_kwh') is not none else '—' }} | {{ p.get('battery_export_kwh') if p.get('battery_export_kwh') is not none else '—' }} | {{ (p.get('ending_soc_percent') ~ '%') if p.get('ending_soc_percent') is not none else '—' }} |
          {% endfor %}
          {% else %}
          Tomorrow's Agile prices have not been published yet. KEMS will populate this table when the feed arrives.
          {% endif %}

  - title: History
    path: history
    icon: mdi:history
    cards:
      - type: markdown
        content: |
          # History
          Customer-facing history stays **Live Data vs KEMS**. Internal replay-engine evidence remains available to KEMS for validation but is not presented as extra products.

      - type: markdown
        title: Live total energy cost summary
        content: |
          {% set periods = [
            ('Today', 'sensor.kems_today_energy_summary'),
            ('Week', 'sensor.kems_week_energy_summary'),
            ('Month', 'sensor.kems_month_energy_summary'),
            ('Year', 'sensor.kems_year_energy_summary'),
            ('All time', 'sensor.kems_all_time_energy_summary')
          ] %}
          | Period | Live total energy cost |
          |---|---:|
          {% for label, entity in periods %}
          {% set v = states(entity) %}
          | {{ label }} | {{ ('£%.2f' | format((v | float(0)) / 100)) if v not in ['unknown','unavailable'] else '—' }} |
          {% endfor %}

      - type: grid
        columns: 3
        square: false
        cards:
          - type: entity
            entity: sensor.kems_accumulation_days_complete
            name: Complete days
          - type: entity
            entity: sensor.kems_learning_confidence
            name: Learning confidence
          - type: entity
            entity: sensor.kems_forecast_validation_days
            name: Forecast validation days

      - type: history-graph
        title: Live vs KEMS electricity cost — 30 days
        hours_to_show: 720
        entities:
          - entity: sensor.kems_observed_cost_today
            name: Live Data
          - entity: sensor.kems_simulated_kems_cost_today
            name: KEMS

      - type: history-graph
        title: House demand — 7 days
        hours_to_show: 168
        entities:
          - entity: sensor.kems_house_load
            name: Live Data
          - entity: sensor.kems_simulated_house_load_power
            name: KEMS

  - title: System
    path: system
    icon: mdi:cog-outline
    cards:
      - type: markdown
        content: |
          # System
          Configuration, update status and safety gates. Real inverter writes remain blocked until commissioning explicitly passes.

      - type: entities
        title: KEMS configuration
        show_header_toggle: false
        entities:
          - entity: select.kems_system_type
            name: Product
          - entity: select.kems_operating_mode
            name: Mode
          - entity: select.kems_export_tariff
            name: Export tariff
          - entity: select.kems_update_mode
            name: Update mode
          - entity: switch.kems_automatic_updates
            name: Automatic updates
          - entity: switch.kems_automatic_maintenance_restart
            name: Automatic maintenance restart
          - entity: switch.kems_backup_before_update
            name: Backup before update
          - entity: time.kems_maintenance_window_start
            name: Maintenance window start
          - entity: time.kems_maintenance_window_end
            name: Maintenance window end

      - type: markdown
        title: Health & safety
        content: |
          | Check | State |
          |---|---|
          | KEMS status | **{{ states('sensor.kems_status') }}** |
          | Accumulator | {{ states('sensor.kems_accumulator_status') }} |
          | Source validation | {{ states('sensor.kems_source_validation') }} |
          | Data quality | {{ states('sensor.kems_data_quality') }} |
          | Simulation ready | {{ states('binary_sensor.kems_simulation_ready') }} |
          | Control plan safe | {{ states('binary_sensor.kems_control_plan_safe') }} |
          | Real backend available | {{ states('binary_sensor.kems_real_control_backend_available') }} |
          | Commands permitted | **{{ states('binary_sensor.kems_control_commands_permitted') }}** |
          | Commissioning | {{ states('sensor.kems_commissioning_readiness') }} |
          | Panel | {{ states('sensor.kems_panel_management_status') }} |
          | Panel firmware | {{ states('sensor.kems_panel_firmware_version') }} |

      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            name: Check for updates
            icon: mdi:refresh
            show_state: false
            tap_action:
              action: perform-action
              perform_action: kems.check_for_updates
          - type: entity
            entity: sensor.kems_control_preflight
            name: Control preflight
            icon: mdi:clipboard-check-outline

      - type: markdown
        title: Update state
        content: |
          {% set u = states.sensor.kems_update_status %}
          **Status:** {{ states('sensor.kems_update_status') }}  
          **Running KEMS:** {{ u.attributes.running_kems_version if u else '—' }}  
          **Target bundle:** {{ u.attributes.bundle if u and u.attributes.bundle else '—' }}  
          **Maintenance:** {{ states('sensor.kems_maintenance_status') }}  
          **Last result:** {{ u.attributes.last_result if u and u.attributes.last_result else '—' }}

          {% if u and u.attributes.last_error %}
          **Failure:** {{ u.attributes.last_error }}
          {% else %}
          **Failure:** —
          {% endif %}

      - type: markdown
        title: Component verification
        content: |
          {% set components = state_attr('sensor.kems_update_status', 'components') or [] %}
          | Component | Installed | Target | Status |
          |---|---|---|---|
          {% for c in components %}
          | {{ c.get('key', '—') }} | {{ c.get('installed') or '—' }} | {{ c.get('target') or '—' }} | {{ c.get('status') or '—' }} |
          {% endfor %}
          {% if not components %}
          | — | — | — | Waiting for update check |
          {% endif %}

      - type: markdown
        title: Recent update history
        content: |
          {% set history = state_attr('sensor.kems_update_status', 'history') or [] %}
          | Completed | Bundle | Result | Error |
          |---|---|---|---|
          {% for h in history | reverse %}
          | {{ h.get('completed_at') or h.get('updated_at') or '—' }} | {{ h.get('bundle') or h.get('target') or '—' }} | {{ h.get('result') or h.get('status') or '—' }} | {{ h.get('error') or '—' }} |
          {% endfor %}
          {% if not history %}
          | — | — | No completed updates recorded | — |
          {% endif %}

          If an optional physical sensor is not commissioned, the dashboard shows `—` instead of treating that as a dashboard failure.
