  - title: System
    path: system
    icon: mdi:cog-outline
    cards:
      - type: markdown
        content: |
          # System
          Configuration, updates and safety in a compact operator view. Physical control remains locked until commissioning and the existing safety gates permit it.

      - type: grid
        columns: 3
        square: false
        cards:
          - type: markdown
            title: Health
            content: |
              | Check | State |
              |---|---|
              | KEMS | **{{ states('sensor.kems_status') }}** |
              | Sources | {{ states('sensor.kems_source_validation') }} |
              | Data quality | {{ states('sensor.kems_data_quality') }} |
              | Accumulator | {{ states('sensor.kems_accumulator_status') }} |
              | Simulation | {{ states('binary_sensor.kems_simulation_ready') }} |
              | Panel | {{ states('sensor.kems_panel_management_status') }} |

          - type: markdown
            title: Control safety
            content: |
              | Gate | State |
              |---|---|
              | Preflight | **{{ states('sensor.kems_control_preflight') }}** |
              | Plan safe | {{ states('binary_sensor.kems_control_plan_safe') }} |
              | Backend available | {{ states('binary_sensor.kems_real_control_backend_available') }} |
              | Commands permitted | **{{ states('binary_sensor.kems_control_commands_permitted') }}** |
              | Commissioning | {{ states('sensor.kems_commissioning_readiness') }} |

          - type: markdown
            title: Update
            content: |
              {% set u = states.sensor.kems_update_status %}
              **Status:** {{ states('sensor.kems_update_status') }}  
              **Running:** {{ u.attributes.running_kems_version if u else '—' }}  
              **Target:** {{ u.attributes.bundle if u and u.attributes.bundle else '—' }}  
              **Maintenance:** {{ states('sensor.kems_maintenance_status') }}  
              **Last result:** {{ u.attributes.last_result if u and u.attributes.last_result else '—' }}

              {% if u and u.attributes.last_error %}
              **Last error:** {{ u.attributes.last_error }}
              {% endif %}

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: KEMS configuration
            show_header_toggle: false
            entities:
              - entity: select.kems_system_type
                name: Product
              - entity: select.kems_operating_mode
                name: Mode
              - entity: select.kems_export_tariff
                name: Export tariff
              - entity: select.kems_update_mode
                name: Update mode
              - entity: switch.kems_automatic_updates
                name: Automatic updates
              - entity: switch.kems_automatic_maintenance_restart
                name: Automatic maintenance restart
              - entity: switch.kems_backup_before_update
                name: Backup before update
              - entity: time.kems_maintenance_window_start
                name: Maintenance starts
              - entity: time.kems_maintenance_window_end
                name: Maintenance ends

          - type: grid
            columns: 1
            square: false
            cards:
              - type: button
                name: Check for updates
                icon: mdi:refresh
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: kems.check_for_updates
              - type: entity
                entity: sensor.kems_panel_firmware_version
                name: Panel firmware
              - type: entity
                entity: sensor.kems_control_preflight
                name: Control preflight

      - type: markdown
        title: Component verification
        content: |
          {% set components = state_attr('sensor.kems_update_status', 'components') or [] %}
          | Component | Installed | Target | Status |
          |---|---|---|---|
          {% for c in components %}
          | {{ c.get('key', '—') }} | {{ c.get('installed') or '—' }} | {{ c.get('target') or '—' }} | {{ c.get('status') or '—' }} |
          {% endfor %}
          {% if not components %}
          | — | — | — | Waiting for update check |
          {% endif %}

      - type: markdown
        title: Recent updates — latest 5
        content: |
          {% set history = state_attr('sensor.kems_update_status', 'history') or [] %}
          | Completed | Bundle | Result |
          |---|---|---|
          {% for h in (history | reverse | list)[0:5] %}
          | {{ (h.get('completed_at') or h.get('updated_at') or '—')[:19] }} | {{ h.get('bundle') or h.get('target') or '—' }} | {{ h.get('result') or h.get('status') or '—' }} |
          {% endfor %}
          {% if not history %}
          | — | — | No completed updates recorded |
          {% endif %}

          Optional physical sensors remain `—` until commissioned; that is not treated as a dashboard failure.
