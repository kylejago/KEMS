          {% if slots %}
          | Time | Rate | KEMS plan | Grid in / out | Batt out | End SOC |
          |---|---:|---|---:|---:|---:|
          {% for p in slots %}
          {% set raw = (p.get('actions') or ['—']) | join(', ') %}
          {% set a = raw | lower %}
          {% set plan = 'Cheap charge' if 'cheap charge' in a else 'Max discharge' if 'maximum discharge' in a else 'Deadline export' if 'deadline' in a else 'Battery export' if 'export battery' in a else 'Store solar' if 'store solar' in a else 'Battery → home' if 'battery to home' in a else raw[:28] %}
          | {{ p.get('label', '—') }} | {{ '%.2f' | format(p.get('rate_pence', 0) | float) }}p | {{ plan }} | {{ '%.2f' | format(p.get('grid_import_kwh', 0) | float) }} / {{ '%.2f' | format(p.get('grid_export_kwh', 0) | float) }} | {{ '%.2f' | format(p.get('battery_export_kwh', 0) | float) }} | {{ ('%.1f%%' | format(p.get('ending_soc_percent') | float)) if p.get('ending_soc_percent') is not none else '—' }} |
          {% endfor %}
          {% else %}
          Tomorrow's slots have not been published yet.
          {% endif %}

