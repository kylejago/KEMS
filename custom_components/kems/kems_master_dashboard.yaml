title: KEMS

views:
  - title: Home
    path: home
    icon: mdi:home-lightning-bolt
    cards:
      - type: markdown
        title: KEMS at a glance
        content: |
          # ⚡ KEMS
          **Status:** {{ states('sensor.kems_status') }}  
          **Mode:** {{ states('select.kems_operating_mode') }}  
          **Product:** {{ states('select.kems_system_type') }}  
          **Export tariff:** {{ states('select.kems_export_tariff') }}

          **Advice:** **{{ states('sensor.kems_advice') }}**  
          {{ state_attr('sensor.kems_advice', 'message') or 'KEMS is analysing your home-energy data.' }}

          KEMS has exactly two user-facing products: **Live Data** shows what the property actually did; **KEMS** shows what KEMS would have done with the configured tariff, system and strategy.

      - type: grid
        columns: 3
        square: false
        cards:
          - type: entity
            entity: sensor.kems_current_import_rate
            name: Import rate now
            icon: mdi:currency-gbp
          - type: entity
            entity: sensor.kems_next_import_rate
            name: Next import rate
            icon: mdi:clock-outline
          - type: entity
            entity: binary_sensor.kems_cheap_period_confirmed
            name: Cheap period
            icon: mdi:weather-night
          - type: entity
            entity: sensor.kems_house_load
            name: Live house load
            icon: mdi:home-lightning-bolt-outline
          - type: entity
            entity: sensor.kems_simulated_battery_state_of_charge
            name: KEMS battery SOC
            icon: mdi:battery
          - type: entity
            entity: sensor.kems_forecast_solar_tomorrow
            name: Solar tomorrow
            icon: mdi:weather-sunny

      - type: markdown
        title: Today — Live Data vs KEMS
        content: |
          {% set live_e = states('sensor.kems_observed_cost_today') | float(0) %}
          {% set kems_e = states('sensor.kems_simulated_kems_cost_today') | float(0) %}
          {% set gas = states('sensor.kems_gas_cost_today') | float(0) %}
          {% set saving = live_e - kems_e %}
          | Today | Live Data | KEMS |
          |---|---:|---:|
          | Electricity net cost | £{{ '%.2f' | format(live_e / 100) }} | £{{ '%.2f' | format(kems_e / 100) }} |
          | Gas cost | £{{ '%.2f' | format(gas / 100) }} | £{{ '%.2f' | format(gas / 100) }} |
          | **Total energy cost** | **£{{ '%.2f' | format((live_e + gas) / 100) }}** | **£{{ '%.2f' | format((kems_e + gas) / 100) }}** |
          | Grid import | {{ states('sensor.kems_observed_grid_import_today') }} kWh | {{ states('sensor.kems_simulated_grid_import_today') }} kWh |
          | Grid export | {{ states('sensor.kems_observed_grid_export_today') }} kWh | {{ states('sensor.kems_simulated_grid_export_today') }} kWh |

          **KEMS saving today:** £{{ '%.2f' | format(saving / 100) }}

      - type: markdown
        title: Current power flow
        content: |
          {% set bad = ['unknown', 'unavailable', 'none', ''] %}
          {% set live_export = states('sensor.kems_grid_export') %}
          {% set live_solar = states('sensor.kems_solar_power') %}
          {% set live_battery = states('sensor.kems_battery_power') %}
          | Flow | Live Data | KEMS |
          |---|---:|---:|
          | House load | {{ states('sensor.kems_house_load') }} kW | {{ states('sensor.kems_simulated_house_load_power') }} kW |
          | Solar | {{ '—' if live_solar | lower in bad else live_solar ~ ' kW' }} | {{ states('sensor.kems_simulated_solar_power') }} kW |
          | Grid import | {{ states('sensor.kems_grid_import') }} kW | {{ states('sensor.kems_simulated_grid_import_power') }} kW |
          | Grid export | {{ '—' if live_export | lower in bad else live_export ~ ' kW' }} | {{ states('sensor.kems_simulated_grid_export_power') }} kW |
          | Battery power | {{ '—' if live_battery | lower in bad else live_battery ~ ' kW' }} | {{ states('sensor.kems_simulated_battery_power') }} kW |
          | Battery SOC | {{ '—' if states('sensor.kems_battery_state_of_charge') | lower in bad else states('sensor.kems_battery_state_of_charge') ~ '%' }} | {{ states('sensor.kems_simulated_battery_state_of_charge') }}% |

          Live solar/battery values remain `—` until the physical system is commissioned. KEMS values are the digital twin.

  - title: Live Data
    path: live-data
    icon: mdi:flash
    cards:
      - type: markdown
        content: |
          # Live Data
          What the property **actually did**. Solar and battery cards are already in place and will automatically begin drawing history once the physical system is commissioned.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: markdown
            title: Live now
            content: |
              {% set bad = ['unknown', 'unavailable', 'none', ''] %}
              {% set ge = states('sensor.kems_grid_export') %}
              {% set solar = states('sensor.kems_solar_power') %}
              {% set batt = states('sensor.kems_battery_power') %}
              {% set soc = states('sensor.kems_battery_state_of_charge') %}
              | Reading | Live Data |
              |---|---:|
              | House load | **{{ states('sensor.kems_house_load') }} kW** |
              | Grid import | {{ states('sensor.kems_grid_import') }} kW |
              | Grid export | {{ '—' if ge | lower in bad else ge ~ ' kW' }} |
              | Solar | {{ '—' if solar | lower in bad else solar ~ ' kW' }} |
              | Battery power | {{ '—' if batt | lower in bad else batt ~ ' kW' }} |
              | Battery SOC | {{ '—' if soc | lower in bad else soc ~ '%' }} |
              | EV connected | {{ states('binary_sensor.kems_ev_connected') }} |
              | EV power | {{ states('sensor.kems_ev_charging_power') }} kW |

          - type: markdown
            title: Daily costs
            content: |
              {% set p = ((state_attr('sensor.kems_energy_cost_comparison', 'periods') or {}).get('today', {}) or {}) %}
              {% set live = p.get('live_data', {}) or {} %}
              | Cost | Live Data |
              |---|---:|
              | Electricity import | {{ ('£%.2f' | format((live.get('electricity_import_cost_pence') | float) / 100)) if live.get('electricity_import_cost_pence') is not none else '—' }} |
              | Standing charge | {{ ('£%.2f' | format((live.get('electricity_standing_charge_pence') | float) / 100)) if live.get('electricity_standing_charge_pence') is not none else '—' }} |
              | Export income | {{ ('−£%.2f' | format((live.get('electricity_export_income_pence') | float) / 100)) if live.get('electricity_export_income_pence') is not none else '—' }} |
              | **Electricity total** | **{{ ('£%.2f' | format((live.get('electricity_total_cost_pence') | float) / 100)) if live.get('electricity_total_cost_pence') is not none else '—' }}** |
              | Gas | {{ ('£%.2f' | format((live.get('gas_total_cost_pence') | float) / 100)) if live.get('gas_total_cost_pence') is not none else '—' }} |
              | **TOTAL ENERGY COST** | **{{ ('£%.2f' | format((live.get('total_energy_cost_pence') | float) / 100)) if live.get('total_energy_cost_pence') is not none else '—' }}** |

      - type: entities
        title: Energy today
        show_header_toggle: false
        entities:
          - entity: sensor.kems_whole_home_energy_today
            name: Whole-home energy
          - entity: sensor.kems_observed_grid_import_today
            name: Grid import
          - entity: sensor.kems_observed_grid_export_today
            name: Grid export
          - entity: sensor.kems_solar_generation_today
            name: Solar generation
          - entity: sensor.kems_gas_usage_today
            name: Gas usage
          - entity: sensor.kems_observed_export_income_today
            name: Export income

      - type: markdown
        title: Power history — today
        content: |
          Each graph has its own scale so low-power flows remain readable. Optional solar and battery sources will show no trace until those live sensors are commissioned.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: history-graph
            title: House demand
            hours_to_show: 24
            entities:
              - entity: sensor.kems_house_load
                name: House load
          - type: history-graph
            title: Grid import
            hours_to_show: 24
            entities:
              - entity: sensor.kems_grid_import
                name: Grid import
          - type: history-graph
            title: Grid export
            hours_to_show: 24
            entities:
              - entity: sensor.kems_grid_export
                name: Grid export
          - type: history-graph
            title: Solar
            hours_to_show: 24
            entities:
              - entity: sensor.kems_solar_power
                name: Solar
          - type: history-graph
            title: Battery power
            hours_to_show: 24
            entities:
              - entity: sensor.kems_battery_power
                name: Battery power
          - type: history-graph
            title: Battery SOC
            hours_to_show: 24
            entities:
              - entity: sensor.kems_battery_state_of_charge
                name: Battery SOC
          - type: history-graph
            title: Energy cost
            hours_to_show: 24
            entities:
              - entity: sensor.kems_observed_cost_today
                name: Electricity
              - entity: sensor.kems_gas_cost_today
                name: Gas

  - title: KEMS
    path: kems
    icon: mdi:lightning-bolt-circle
    cards:
      - type: markdown
        content: |
          # KEMS
          The digital twin of the same property. This page mirrors **Live Data** but every power and energy figure is what KEMS would have done using the configured system, tariff and strategy.

          **Strategy:** {{ state_attr('sensor.kems_energy_cost_comparison', 'selected_kems_strategy_label') or states('select.kems_export_tariff') }}  
          **Mode:** {{ states('select.kems_operating_mode') }}

      - type: grid
        columns: 2
        square: false
        cards:
          - type: markdown
            title: KEMS now
            content: |
              | Reading | KEMS |
              |---|---:|
              | House load | **{{ states('sensor.kems_simulated_house_load_power') }} kW** |
              | Grid import | {{ states('sensor.kems_simulated_grid_import_power') }} kW |
              | Grid export | {{ states('sensor.kems_simulated_grid_export_power') }} kW |
              | Solar | {{ states('sensor.kems_simulated_solar_power') }} kW |
              | Battery power | {{ states('sensor.kems_simulated_battery_power') }} kW |
              | Battery SOC | {{ states('sensor.kems_simulated_battery_state_of_charge') }}% |
              | Solar → battery | {{ states('sensor.kems_simulated_solar_to_battery_power') }} kW |
              | Battery → home | {{ states('sensor.kems_simulated_battery_to_home_power') }} kW |

          - type: markdown
            title: Daily costs
            content: |
              {% set p = ((state_attr('sensor.kems_energy_cost_comparison', 'periods') or {}).get('today', {}) or {}) %}
              {% set kems = p.get('kems', {}) or {} %}
              | Cost | KEMS |
              |---|---:|
              | Electricity import | {{ ('£%.2f' | format((kems.get('electricity_import_cost_pence') | float) / 100)) if kems.get('electricity_import_cost_pence') is not none else '—' }} |
              | Standing charge | {{ ('£%.2f' | format((kems.get('electricity_standing_charge_pence') | float) / 100)) if kems.get('electricity_standing_charge_pence') is not none else '—' }} |
              | Export income | {{ ('−£%.2f' | format((kems.get('electricity_export_income_pence') | float) / 100)) if kems.get('electricity_export_income_pence') is not none else '—' }} |
              | Supplier credits | {{ ('−£%.2f' | format((kems.get('supplier_energy_credit_pence') | float) / 100)) if kems.get('supplier_energy_credit_pence') is not none else '—' }} |
              | **Electricity total** | **{{ ('£%.2f' | format((kems.get('electricity_total_cost_pence') | float) / 100)) if kems.get('electricity_total_cost_pence') is not none else '—' }}** |
              | Gas | {{ ('£%.2f' | format((kems.get('gas_total_cost_pence') | float) / 100)) if kems.get('gas_total_cost_pence') is not none else '—' }} |
              | **TOTAL ENERGY COST** | **{{ ('£%.2f' | format((kems.get('total_energy_cost_pence') | float) / 100)) if kems.get('total_energy_cost_pence') is not none else '—' }}** |

      - type: markdown
        title: Energy today
        content: |
          {% set p = ((state_attr('sensor.kems_energy_cost_comparison', 'periods') or {}).get('today', {}) or {}) %}
          {% set kems = p.get('kems', {}) or {} %}
          | Energy | KEMS |
          |---|---:|
          | Whole-home energy | {{ (kems.get('home_energy_kwh') ~ ' kWh') if kems.get('home_energy_kwh') is not none else '—' }} |
          | Grid import | {{ states('sensor.kems_simulated_grid_import_today') }} kWh |
          | Grid export | {{ states('sensor.kems_simulated_grid_export_today') }} kWh |
          | Solar generation | {{ states('sensor.kems_simulated_solar_generation_today') }} kWh |
          | Battery charged | {{ states('sensor.kems_simulated_battery_charge_today') }} kWh |
          | Battery → home | {{ states('sensor.kems_simulated_battery_to_home_today') }} kWh |
          | Battery export | {{ states('sensor.kems_simulated_battery_export_today') }} kWh |
          | Export income | £{{ '%.2f' | format((states('sensor.kems_simulated_export_income_today') | float(0)) / 100) }} |

      - type: markdown
        title: Power history — today
        content: |
          These graphs use the KEMS simulated equivalents of the Live Data page so both views can be compared on the same structure.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: history-graph
            title: House demand
            hours_to_show: 24
            entities:
              - entity: sensor.kems_simulated_house_load_power
                name: House load
          - type: history-graph
            title: Grid import
            hours_to_show: 24
            entities:
              - entity: sensor.kems_simulated_grid_import_power
                name: Grid import
          - type: history-graph
            title: Grid export
            hours_to_show: 24
            entities:
              - entity: sensor.kems_simulated_grid_export_power
                name: Grid export
          - type: history-graph
            title: Solar
            hours_to_show: 24
            entities:
              - entity: sensor.kems_simulated_solar_power
                name: Solar
          - type: history-graph
            title: Battery power
            hours_to_show: 24
            entities:
              - entity: sensor.kems_simulated_battery_power
                name: Battery power
          - type: history-graph
            title: Battery SOC
            hours_to_show: 24
            entities:
              - entity: sensor.kems_simulated_battery_state_of_charge
                name: Battery SOC
          - type: history-graph
            title: Energy cost
            hours_to_show: 24
            entities:
              - entity: sensor.kems_simulated_kems_cost_today
                name: Electricity
              - entity: sensor.kems_gas_cost_today
                name: Gas

      - type: grid
        columns: 3
        square: false
        cards:
          - type: entity
            entity: sensor.kems_forecast_solar_tomorrow
            name: Solar tomorrow
          - type: entity
            entity: sensor.kems_forecast_house_demand_tomorrow
            name: House demand tomorrow
          - type: entity
            entity: sensor.kems_forecast_required_morning_soc
            name: Required morning SOC
          - type: entity
            entity: sensor.kems_hours_until_next_cheap_period
            name: Hours until cheap
          - type: entity
            entity: sensor.kems_exportable_battery_energy_remaining
            name: Exportable battery
          - type: entity
            entity: sensor.kems_target_battery_export_power
            name: Battery export target

      - type: markdown
        title: Today's KEMS plan — overview
        content: |
          {% set s = states.sensor.kems_agile_slots %}
          {% set slots = state_attr('sensor.kems_agile_slots', 'today_slots') or [] %}
          **Current Agile export rate:** {{ (s.attributes.current_rate_pence ~ ' p/kWh') if s and s.attributes.current_rate_pence is not none else '—' }}  
          **Price coverage:** {{ s.attributes.today_count if s else 0 }}/{{ s.attributes.today_expected if s else 48 }} slots  
          **Plan:** {{ state_attr('sensor.kems_agile_rolling_export_plan', 'action') or states('sensor.kems_agile_rolling_export_plan') or '—' }}

          The plan is split into three readable sections below instead of one 48-row table.

      - type: markdown
        title: Today — 00:00 to 07:30
        content: |
          {% set slots = (state_attr('sensor.kems_agile_slots', 'today_slots') or [])[0:16] %}
          {% if slots %}
          | Time | Rate | KEMS plan | Grid in / out | Batt out | End SOC |
          |---|---:|---|---:|---:|---:|
          {% for p in slots %}
          {% set raw = (p.get('actions') or ['—']) | join(', ') %}
          {% set a = raw | lower %}
          {% set plan = 'Cheap charge' if 'cheap charge' in a else 'Max discharge' if 'maximum discharge' in a else 'Deadline export' if 'deadline' in a else 'Battery export' if 'export battery' in a else 'Store solar' if 'store solar' in a else 'Battery → home' if 'battery to home' in a else raw[:28] %}
          | {{ p.get('label', '—') }} | {{ '%.2f' | format(p.get('rate_pence', 0) | float) }}p | {{ plan }} | {{ '%.2f' | format(p.get('grid_import_kwh', 0) | float) }} / {{ '%.2f' | format(p.get('grid_export_kwh', 0) | float) }} | {{ '%.2f' | format(p.get('battery_export_kwh', 0) | float) }} | {{ ('%.1f%%' | format(p.get('ending_soc_percent') | float)) if p.get('ending_soc_percent') is not none else '—' }} |
          {% endfor %}
          {% else %}
          Today's plan is not available yet.
          {% endif %}

      - type: markdown
        title: Today — 08:00 to 15:30
        content: |
          {% set slots = (state_attr('sensor.kems_agile_slots', 'today_slots') or [])[16:32] %}
          {% if slots %}
          | Time | Rate | KEMS plan | Grid in / out | Batt out | End SOC |
          |---|---:|---|---:|---:|---:|
          {% for p in slots %}
          {% set raw = (p.get('actions') or ['—']) | join(', ') %}
          {% set a = raw | lower %}
          {% set plan = 'Cheap charge' if 'cheap charge' in a else 'Max discharge' if 'maximum discharge' in a else 'Deadline export' if 'deadline' in a else 'Battery export' if 'export battery' in a else 'Store solar' if 'store solar' in a else 'Battery → home' if 'battery to home' in a else raw[:28] %}
          | {{ p.get('label', '—') }} | {{ '%.2f' | format(p.get('rate_pence', 0) | float) }}p | {{ plan }} | {{ '%.2f' | format(p.get('grid_import_kwh', 0) | float) }} / {{ '%.2f' | format(p.get('grid_export_kwh', 0) | float) }} | {{ '%.2f' | format(p.get('battery_export_kwh', 0) | float) }} | {{ ('%.1f%%' | format(p.get('ending_soc_percent') | float)) if p.get('ending_soc_percent') is not none else '—' }} |
          {% endfor %}
          {% else %}
          No afternoon plan is available yet.
          {% endif %}

      - type: markdown
        title: Today — 16:00 to 23:30
        content: |
          {% set slots = (state_attr('sensor.kems_agile_slots', 'today_slots') or [])[32:48] %}
          {% if slots %}
          | Time | Rate | KEMS plan | Grid in / out | Batt out | End SOC |
          |---|---:|---|---:|---:|---:|
          {% for p in slots %}
          {% set raw = (p.get('actions') or ['—']) | join(', ') %}
          {% set a = raw | lower %}
          {% set plan = 'Cheap charge' if 'cheap charge' in a else 'Max discharge' if 'maximum discharge' in a else 'Deadline export' if 'deadline' in a else 'Battery export' if 'export battery' in a else 'Store solar' if 'store solar' in a else 'Battery → home' if 'battery to home' in a else raw[:28] %}
          | {{ p.get('label', '—') }} | {{ '%.2f' | format(p.get('rate_pence', 0) | float) }}p | {{ plan }} | {{ '%.2f' | format(p.get('grid_import_kwh', 0) | float) }} / {{ '%.2f' | format(p.get('grid_export_kwh', 0) | float) }} | {{ '%.2f' | format(p.get('battery_export_kwh', 0) | float) }} | {{ ('%.1f%%' | format(p.get('ending_soc_percent') | float)) if p.get('ending_soc_percent') is not none else '—' }} |
          {% endfor %}
          {% else %}
          No evening plan is available yet.
          {% endif %}

  - title: Compare
    path: compare
    icon: mdi:compare-horizontal
    cards:
      - type: markdown
        content: |
          # Compare
          Three views of the same property: **Without KEMS** is the counterfactual cost if the solar/battery/KEMS system had never been installed, **Live** is what actually happened, and **KEMS** is what the digital twin would have done.

      - type: grid
        columns: 3
        square: false
        cards:
          - type: markdown
            title: Without KEMS
            content: |
              {% set p = ((state_attr('sensor.kems_energy_cost_comparison', 'periods') or {}).get('today', {}) or {}) %}
              {% set live = p.get('live_data', {}) or {} %}
              {% set gas = live.get('gas_total_cost_pence') %}
              {% set base = states('sensor.kems_compare_no_system_cost_today') %}
              {% set base_p = (base | float(0)) if base not in ['unknown','unavailable','none',''] else none %}
              {% set total = (base_p + (gas | float(0))) if base_p is not none and gas is not none else none %}
              {% set s = states.sensor.kems_compare_no_system_cost_today %}
              **Today total energy cost**  
              # {{ ('£%.2f' | format(total / 100)) if total is not none else '—' }}

              Electricity: {{ ('£%.2f' | format(base_p / 100)) if base_p is not none else '—' }}  
              Gas: {{ ('£%.2f' | format((gas | float) / 100)) if gas is not none else '—' }}  
              Grid import: {{ (s.attributes.grid_import_kwh ~ ' kWh') if s and s.attributes.grid_import_kwh is not none else '—' }}  
              Grid export: {{ (s.attributes.grid_export_kwh ~ ' kWh') if s and s.attributes.grid_export_kwh is not none else '0 kWh' }}

              _Counterfactual no-system replay._

          - type: markdown
            title: Live
            content: |
              {% set p = ((state_attr('sensor.kems_energy_cost_comparison', 'periods') or {}).get('today', {}) or {}) %}
              {% set live = p.get('live_data', {}) or {} %}
              **Today total energy cost**  
              # {{ ('£%.2f' | format((live.get('total_energy_cost_pence') | float) / 100)) if live.get('total_energy_cost_pence') is not none else '—' }}

              Electricity: {{ ('£%.2f' | format((live.get('electricity_total_cost_pence') | float) / 100)) if live.get('electricity_total_cost_pence') is not none else '—' }}  
              Gas: {{ ('£%.2f' | format((live.get('gas_total_cost_pence') | float) / 100)) if live.get('gas_total_cost_pence') is not none else '—' }}  
              Grid import: {{ (live.get('grid_import_kwh') ~ ' kWh') if live.get('grid_import_kwh') is not none else '—' }}  
              Grid export: {{ (live.get('grid_export_kwh') ~ ' kWh') if live.get('grid_export_kwh') is not none else '—' }}

              _Measured property data._

          - type: markdown
            title: KEMS
            content: |
              {% set p = ((state_attr('sensor.kems_energy_cost_comparison', 'periods') or {}).get('today', {}) or {}) %}
              {% set kems = p.get('kems', {}) or {} %}
              **Today total energy cost**  
              # {{ ('£%.2f' | format((kems.get('total_energy_cost_pence') | float) / 100)) if kems.get('total_energy_cost_pence') is not none else '—' }}

              Electricity: {{ ('£%.2f' | format((kems.get('electricity_total_cost_pence') | float) / 100)) if kems.get('electricity_total_cost_pence') is not none else '—' }}  
              Gas: {{ ('£%.2f' | format((kems.get('gas_total_cost_pence') | float) / 100)) if kems.get('gas_total_cost_pence') is not none else '—' }}  
              Grid import: {{ (kems.get('grid_import_kwh') ~ ' kWh') if kems.get('grid_import_kwh') is not none else '—' }}  
              Grid export: {{ (kems.get('grid_export_kwh') ~ ' kWh') if kems.get('grid_export_kwh') is not none else '—' }}

              _Configured KEMS digital twin._

      - type: markdown
        title: Today — side by side
        content: |
          {% set p = ((state_attr('sensor.kems_energy_cost_comparison', 'periods') or {}).get('today', {}) or {}) %}
          {% set live = p.get('live_data', {}) or {} %}
          {% set kems = p.get('kems', {}) or {} %}
          {% set base_state = states('sensor.kems_compare_no_system_cost_today') %}
          {% set base_e = (base_state | float(0)) if base_state not in ['unknown','unavailable','none',''] else none %}
          {% set gas = live.get('gas_total_cost_pence') %}
