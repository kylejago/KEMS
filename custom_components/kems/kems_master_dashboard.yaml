  - title: Tomorrow
    path: tomorrow
    icon: mdi:weather-sunset-up
    cards:
      - type: markdown
        content: |
          # Tomorrow
          A forward-looking KEMS overview using the currently published tariff slots, forecast solar and forecast house demand. It is **simulated planning**, not Live Data.

      - type: grid
        columns: 3
        square: false
        cards:
          - type: entity
            entity: sensor.kems_forecast_solar_tomorrow
            name: Forecast solar
          - type: entity
            entity: sensor.kems_forecast_house_demand_tomorrow
            name: Forecast house demand
          - type: entity
            entity: sensor.kems_forecast_required_morning_soc
            name: Required morning SOC
          - type: entity
            entity: sensor.kems_forecast_maximum_overnight_soc
            name: Overnight charge target
          - type: entity
            entity: sensor.kems_forecast_additional_cheap_time_required
            name: Extra cheap time needed
          - type: entity
            entity: sensor.kems_forecast_solar_recovery_target
            name: Solar recovery target

      - type: markdown
        title: Tomorrow — simulated overview
        content: |
          {% set s = states.sensor.kems_agile_slots %}
          {% set slots = state_attr('sensor.kems_agile_slots', 'tomorrow_slots') or [] %}
          {% set ns = namespace(imp=0.0, exp=0.0, batt=0.0, income=0.0, final_soc=none) %}
          {% for p in slots %}
            {% set ns.imp = ns.imp + (p.get('grid_import_kwh', 0) | float) %}
            {% set ns.exp = ns.exp + (p.get('grid_export_kwh', 0) | float) %}
            {% set ns.batt = ns.batt + (p.get('battery_export_kwh', 0) | float) %}
            {% set ns.income = ns.income + ((p.get('rate_pence', 0) | float) * (p.get('grid_export_kwh', 0) | float)) %}
            {% if p.get('ending_soc_percent') is not none %}{% set ns.final_soc = p.get('ending_soc_percent') | float %}{% endif %}
          {% endfor %}
          | Forecast | KEMS tomorrow |
          |---|---:|
          | Price publication | {{ s.attributes.tomorrow_status if s else 'Waiting for publication' }} |
          | Published slots | {{ slots | count }}/48 |
          | Forecast house demand | {{ states('sensor.kems_forecast_house_demand_tomorrow') }} kWh |
          | Forecast solar | {{ states('sensor.kems_forecast_solar_tomorrow') }} kWh |
          | Planned grid import | {{ '%.2f' | format(ns.imp) }} kWh |
          | Planned grid export | {{ '%.2f' | format(ns.exp) }} kWh |
          | Planned battery export | {{ '%.2f' | format(ns.batt) }} kWh |
          | Estimated Agile export income | £{{ '%.2f' | format(ns.income / 100) }} |
          | Forecast end SOC | {{ ('%.1f%%' | format(ns.final_soc)) if ns.final_soc is not none else '—' }} |

          Import **cost** is not inferred from the Agile Outgoing export-rate feed; KEMS only shows a monetary forecast here where the currently available slot data supports it.

      - type: markdown
