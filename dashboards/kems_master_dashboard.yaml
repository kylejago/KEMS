  - title: System
    path: system
    icon: mdi:cog-outline
    cards:
      - type: markdown
        content: |
          # System
          Configuration, updates and safety in a compact operator view. Physical control remains locked until commissioning and the existing safety gates permit it.

      - type: grid
        columns: 3
        square: false
        cards:
          - type: markdown
            title: Health
            content: |
              | Check | State |
              |---|---|
              | KEMS | **{{ states('sensor.kems_status') }}** |
              | Sources | {{ states('sensor.kems_source_validation') }} |
              | Data quality | {{ states('sensor.kems_data_quality') }} |
              | Accumulator | {{ states('sensor.kems_accumulator_status') }} |
              | Simulation | {{ states('binary_sensor.kems_simulation_ready') }} |
              | Panel | {{ states('sensor.kems_panel_management_status') }} |

          - type: markdown
            title: Control safety
            content: |
              | Gate | State |
              |---|---|
              | Preflight | **{{ states('sensor.kems_control_preflight') }}** |
              | Plan safe | {{ states('binary_sensor.kems_control_plan_safe') }} |
              | Backend available | {{ states('binary_sensor.kems_real_control_backend_available') }} |
              | Commands permitted | **{{ states('binary_sensor.kems_control_commands_permitted') }}** |
              | Commissioning | {{ states('sensor.kems_commissioning_readiness') }} |

          - type: markdown
            title: Update
            content: |
              {% set u = states.sensor.kems_update_status %}
              **Status:** {{ states('sensor.kems_update_status') }}  
              **Running:** {{ u.attributes.running_kems_version if u else '—' }}  
              **Target:** {{ u.attributes.bundle if u and u.attributes.bundle else '—' }}  
              **Maintenance:** {{ states('sensor.kems_maintenance_status') }}  
              **Last result:** {{ u.attributes.last_result if u and u.attributes.last_result else '—' }}

              {% if u and u.attributes.last_error %}
              **Last error:** {{ u.attributes.last_error }}
              {% endif %}

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: KEMS configuration
            show_header_toggle: false
            entities:
              - entity: select.kems_system_type
                name: Product
              - entity: select.kems_operating_mode
                name: Mode
              - entity: select.kems_export_tariff
                name: Export tariff
              - entity: select.kems_panel_layout
                name: Panel layout
              - entity: select.kems_update_mode
                name: Update mode
              - entity: switch.kems_automatic_updates
                name: Automatic updates
              - entity: switch.kems_automatic_maintenance_restart
                name: Automatic maintenance restart
              - entity: switch.kems_backup_before_update
                name: Backup before update
              - entity: time.kems_maintenance_window_start
                name: Maintenance starts
              - entity: time.kems_maintenance_window_end
                name: Maintenance ends

          - type: grid
            columns: 1
            square: false
            cards:
              - type: button
                name: Check for updates
                icon: mdi:refresh
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: kems.check_for_updates
              - type: entity
                entity: sensor.kems_panel_firmware_version
                name: Panel firmware
              - type: entity
                entity: sensor.kems_control_preflight
                name: Control preflight

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: Happy Hour
            show_header_toggle: false
            entities:
              - entity: switch.kems_weekend_happy_hour_planning
                name: Manual fallback planning
              - entity: switch.kems_weekend_happy_hour_auto_join
                name: Auto join recommended Happy Hour
              - entity: datetime.kems_weekend_happy_hour_start
                name: Manual event start
              - entity: select.kems_weekend_happy_hour_duration
                name: Event duration
              - entity: switch.kems_happy_hour_ohme_control
                name: Allow Ohme control

          - type: markdown
            title: Happy Hour planner & policy
            content: |
              {% set hh = 'switch.kems_weekend_happy_hour_auto_join' %}
              {% set status = state_attr(hh, 'status') or 'waiting_for_first_planner_update' %}
              {% set rec = state_attr(hh, 'recommendation') or {} %}
              {% set benefit = state_attr(hh, 'estimated_net_benefit_pence') %}
              {% if benefit is none %}{% set benefit = rec.get('net_benefit_pence') %}{% endif %}
              **Planner:** **{{ status | replace('_', ' ') | title }}**
              **Discovery source:** {{ state_attr(hh, 'source') or '-' }}
              **Happy Hours banked:** {{ state_attr(hh, 'weekend_happy_hours_available') if state_attr(hh, 'weekend_happy_hours_available') is not none else '-' }}
              **Redeemable this event day:** {{ state_attr(hh, 'weekend_happy_hours_redeemable_event_day') if state_attr(hh, 'weekend_happy_hours_redeemable_event_day') is not none else '-' }} h
              **Event-day limit:** {{ state_attr(hh, 'weekend_happy_hours_event_day_limit') or 2 }} h
              **Balance basis:** {{ state_attr(hh, 'weekend_happy_hours_balance_basis') or '-' }}
              **Reason / gate:** {{ state_attr(hh, 'join_block_reason') or '-' }}
              **Candidate slots:** {{ state_attr(hh, 'candidate_count') if state_attr(hh, 'candidate_count') is not none else '-' }}
              **Recommended start:** {{ state_attr(hh, 'recommended_start') or state_attr(hh, 'booked_start') or '-' }}
              **Recommended end:** {{ state_attr(hh, 'recommended_end') or state_attr(hh, 'booked_end') or '-' }}
              **Import price coverage:** {{ (state_attr(hh, 'import_price_coverage_percent') ~ '%') if state_attr(hh, 'import_price_coverage_percent') is not none else '-' }}
              **Export price coverage:** {{ (state_attr(hh, 'export_price_coverage_percent') ~ '%') if state_attr(hh, 'export_price_coverage_percent') is not none else '-' }}
              **Battery free charge:** {{ (rec.get('expected_battery_free_import_kwh') ~ ' kWh') if rec.get('expected_battery_free_import_kwh') is not none else '-' }}
              **Free house import:** {{ (rec.get('expected_house_free_import_kwh') ~ ' kWh') if rec.get('expected_house_free_import_kwh') is not none else '-' }}
              **Solar opportunity:** {{ (rec.get('expected_solar_opportunity_kwh') ~ ' kWh') if rec.get('expected_solar_opportunity_kwh') is not none else '-' }}
              **Planned pre-event export:** {{ (state_attr(hh, 'planned_pre_event_export_kwh') ~ ' kWh') if state_attr(hh, 'planned_pre_event_export_kwh') is not none else ((rec.get('planned_pre_event_export_kwh') ~ ' kWh') if rec.get('planned_pre_event_export_kwh') is not none else '-') }}
              **Estimated net benefit:** {{ ('GBP %.2f' | format((benefit | float) / 100)) if benefit is not none else '-' }}
              **External booking authority now:** {{ 'PERMITTED' if state_attr(hh, 'external_join_authority') else 'blocked' }}

              {% set choices = state_attr(hh, 'evaluated_candidates') or [] %}
              {% if choices %}
              | Candidate | Net benefit | Free battery | Pre-event export |
              |---|---:|---:|---:|
              {% for c in choices %}
              | {{ c.get('start', '-') }} | GBP {{ '%.2f' | format((c.get('net_benefit_pence', 0) | float) / 100) }} | {{ c.get('expected_battery_free_import_kwh', '-') }} kWh | {{ c.get('planned_pre_event_export_kwh', '-') }} kWh |
              {% endfor %}
              {% endif %}

              **Automatic Octopus detection remains primary.** Manual planning is the fallback when KEMS cannot confidently identify the booked event.

              **Reward cap:** **16 kWh per reward hour**, independently. Unused allowance never carries forward and KEMS never borrows from a later reward hour.

              KEMS reserves the maximum useful battery charge first, protects unavoidable home demand inside the same hourly cap, then makes only the remainder available to the EV. When that reward hour reaches its cap, Happy Hour import authority ends immediately and normal tariff logic resumes.

              **Ohme control is opt-in** and only operates for an automatically verified Happy Hour; it does not turn a manual fallback into charger-write authority.

      - type: markdown
        title: Component verification
        content: |
          {% set components = state_attr('sensor.kems_update_status', 'components') or [] %}
          | Component | Installed | Target | Status |
          |---|---|---|---|
          {% for c in components -%}
          | {{ c.get('key', '—') }} | {{ c.get('installed') or '—' }} | {{ c.get('target') or '—' }} | {{ c.get('status') or '—' }} |
          {% endfor -%}
          {% if not components -%}
          | — | — | — | Waiting for update check |
          {% endif %}

      - type: markdown
        title: Recent updates — latest 5
        content: |
          {% set history = state_attr('sensor.kems_update_status', 'history') or [] %}
          | Completed | Bundle | Result |
          |---|---|---|
          {% for h in (history | reverse | list)[0:5] -%}
          | {{ (h.get('completed_at') or h.get('updated_at') or '—')[:19] }} | {{ h.get('bundle') or h.get('target') or '—' }} | {{ h.get('result') or h.get('status') or '—' }} |
          {% endfor -%}
          {% if not history -%}
          | — | — | No completed updates recorded |
          {% endif %}

          Optional physical sensors remain `—` until commissioned; that is not treated as a dashboard failure.
