  - title: All Entities
    path: all-entities
    icon: mdi:database-eye
    cards:
      - type: markdown
        content: |
          # Every KEMS entity currently registered
          Use this dynamic page if Home Assistant retains an older entity ID or adds a suffix.
      - type: markdown
        title: Sensors
        content: |
          | Entity | State | Unit |
          |---|---:|---|
          {% for item in states.sensor | sort(attribute='entity_id') %}{% if item.entity_id.startswith('sensor.kems_') %}
          | `{{ item.entity_id }}` | {{ item.state }} | {{ item.attributes.unit_of_measurement | default('', true) }} |
          {% endif %}{% endfor %}
      - type: markdown
        title: Binary sensors
        content: |
          | Entity | State |
          |---|---:|
          {% for item in states.binary_sensor | sort(attribute='entity_id') %}{% if item.entity_id.startswith('binary_sensor.kems_') %}
          | `{{ item.entity_id }}` | {{ item.state }} |
          {% endif %}{% endfor %}
      - type: markdown
        title: Selects and switches
        content: |
          {% for item in states.select | sort(attribute='entity_id') %}{% if item.entity_id.startswith('select.kems_') %}
          `{{ item.entity_id }}` — **{{ item.state }}**  
          {% endif %}{% endfor %}
          {% for item in states.switch | sort(attribute='entity_id') %}{% if item.entity_id.startswith('switch.kems_') %}
          `{{ item.entity_id }}` — **{{ item.state }}**  
          {% endif %}{% endfor %}
