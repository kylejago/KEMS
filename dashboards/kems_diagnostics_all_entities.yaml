title: KEMS Diagnostics
views:
  - title: All entities
    path: all-entities
    icon: mdi:stethoscope
    type: masonry
    cards:
      - type: markdown
        content: |
          # KEMS complete diagnostic dashboard

          This dashboard dynamically lists every current KEMS entity, so it also
          works if Home Assistant changes or suffixes an entity ID.

          When reporting a problem, capture this page using a full-page screenshot.
          Also download diagnostics from **Settings → Devices & services → KEMS →
          three dots → Download diagnostics**.

          **Status:** {{ states('sensor.kems_status') }}  
          **Phase:** {{ states('sensor.kems_phase') }}  
          **Data quality:** {{ states('sensor.kems_data_quality') }}%  
          **History samples:** {{ states('sensor.kems_history_samples') }}  
          **Source validation:** {{ states('sensor.kems_source_validation') }}

      - type: markdown
        title: Source isolation
        content: |
          {% set validation = states('sensor.kems_source_validation') %}
          {% if validation == 'OK' %}
          ✅ All configured inputs belong to supported source integrations.
          {% else %}
          ⚠️ **{{ validation }}**

          KEMS rejected and removed these mappings during startup:

          {{ state_attr('sensor.kems_source_validation', 'summary') }}
          {% endif %}

          Observed data can never use `sensor.kems_*` simulation outputs as inputs.

      - type: markdown
        title: Grid calculation detail
        content: |
          | Reading | Value |
          |---|---:|
          | Import | {{ states('sensor.kems_grid_import') }} kW |
          | Export | {{ states('sensor.kems_grid_export') }} kW |
          | Signed net | {{ states('sensor.kems_grid_net_power') }} kW |
          | Direction | {{ states('sensor.kems_grid_flow_direction') }} |
          | Normalisation | {{ states('sensor.kems_grid_normalisation_mode') }} |
          | Raw import source | {{ states('sensor.kems_raw_grid_import_source') }} kW |
          | Raw export source | {{ states('sensor.kems_raw_grid_export_source') }} kW |

          **Net convention:** positive means importing; negative means exporting.
          The separate import and export entities are always non-negative.

      - type: markdown
        title: All KEMS sensors
        content: |
          | Entity | State | Unit |
          |---|---:|---|
          {% for item in states.sensor | sort(attribute='entity_id') %}
          {% if item.entity_id.startswith('sensor.kems_') %}
          | `{{ item.entity_id }}` | {{ item.state }} | {{ item.attributes.unit_of_measurement | default('', true) }} |
          {% endif %}
          {% endfor %}

      - type: markdown
        title: All KEMS binary sensors
        content: |
          | Entity | State |
          |---|---:|
          {% for item in states.binary_sensor | sort(attribute='entity_id') %}
          {% if item.entity_id.startswith('binary_sensor.kems_') %}
          | `{{ item.entity_id }}` | {{ item.state }} |
          {% endif %}
          {% endfor %}

      - type: markdown
        title: KEMS update entities
        content: |
          | Entity | State | Installed | Latest |
          |---|---:|---|---|
          {% for item in states.update | sort(attribute='entity_id') %}
          {% if item.entity_id.startswith('update.kems_') %}
          | `{{ item.entity_id }}` | {{ item.state }} | {{ item.attributes.installed_version | default('', true) }} | {{ item.attributes.latest_version | default('', true) }} |
          {% endif %}
          {% endfor %}
