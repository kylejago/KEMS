title: KEMS ROI & Lifetime Advanced
views:
  - title: ROI
    path: roi
    icon: mdi:finance
    type: masonry
    cards:
      - type: custom:button-card
        entity: sensor.kems_actual_roi_percentage
        name: |
          [[[
            if (states['binary_sensor.kems_system_paid_back']?.state === 'on') {
              return 'SYSTEM PAID BACK — PROFIT MODE';
            }
            if (states['binary_sensor.kems_system_installed']?.state === 'on') {
              return 'SYSTEM PAYBACK';
            }
            return 'PRE-INSTALL PAYBACK SIMULATION';
          ]]]
        show_state: false
        custom_fields:
          battery: |
            [[[
              const installed = states['binary_sensor.kems_system_installed']?.state === 'on';
              const paid = states['binary_sensor.kems_system_paid_back']?.state === 'on';
              const investment = Number(states['sensor.kems_system_investment']?.state) || 0;
              const actual = Number(states['sensor.kems_actual_value_created_total']?.state) || 0;
              const simulated = Number(states['sensor.kems_lifetime_simulated_system_value']?.state) || 0;
              const recovered = installed ? actual : simulated;
              const percentage = investment > 0 ? Math.max(0, recovered / investment * 100) : 0;
              const fill = Math.min(percentage, 100);
              const colour = paid ? '#f5c542' : '#2ecc71';
              return `
                <div class="kems-battery-shell">
                  <div class="kems-battery-tip"></div>
                  <div class="kems-battery-fill" style="height:${fill}%;background:${colour}"></div>
                  <div class="kems-battery-label">${percentage.toFixed(1)}%</div>
                </div>`;
            ]]]
          headline: |
            [[[
              const paid = states['binary_sensor.kems_system_paid_back']?.state === 'on';
              const installed = states['binary_sensor.kems_system_installed']?.state === 'on';
              if (paid) {
                const profit = states['sensor.kems_actual_net_profit']?.state ?? '0';
                return `<b>£${profit} profit after payback</b>`;
              }
              if (installed) {
                const value = states['sensor.kems_actual_value_created_total']?.state ?? '0';
                const investment = states['sensor.kems_system_investment']?.state ?? '0';
                return `<b>£${value} recovered of £${investment}</b>`;
              }
              const simulated = states['sensor.kems_lifetime_simulated_system_value']?.state ?? '0';
              const investment = states['sensor.kems_system_investment']?.state ?? '0';
              return `<b>£${simulated} simulated value of £${investment}</b>`;
            ]]]
          detail: |
            [[[
              const paid = states['binary_sensor.kems_system_paid_back']?.state === 'on';
              if (paid) {
                return `Paid back: ${states['sensor.kems_actual_payback_date']?.state ?? '—'}`;
              }
              if (states['binary_sensor.kems_system_installed']?.state === 'on') {
                return `Remaining: £${states['sensor.kems_actual_payback_remaining']?.state ?? '—'}`;
              }
              return `Predicted payback: ${states['sensor.kems_predicted_payback_years']?.state ?? '—'} years`;
            ]]]
        styles:
          card:
            - padding: 24px
            - min-height: 430px
          name:
            - font-size: 22px
            - font-weight: 700
          grid:
            - grid-template-areas: '"n n" "battery headline" "battery detail"'
            - grid-template-columns: 180px 1fr
            - grid-template-rows: min-content 1fr min-content
          custom_fields:
            battery:
              - align-self: center
              - justify-self: center
            headline:
              - align-self: center
              - font-size: 26px
              - text-align: left
            detail:
              - font-size: 16px
              - text-align: left
        extra_styles: |
          .kems-battery-shell {
            width: 105px;
            height: 250px;
            border: 7px solid var(--primary-text-color);
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            background: rgba(127,127,127,.15);
          }
          .kems-battery-tip {
            width: 45px;
            height: 15px;
            border-radius: 5px 5px 0 0;
            background: var(--primary-text-color);
            position: absolute;
            left: 30px;
            top: -20px;
          }
          .kems-battery-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            transition: height 1s ease;
          }
          .kems-battery-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 1px 3px #000;
            color: white;
          }

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.kems_predicted_annual_saving
            name: Predicted annual saving
            icon: mdi:chart-line
          - type: custom:mushroom-entity-card
            entity: sensor.kems_predicted_payback_date
            name: Predicted payback date
            icon: mdi:calendar-check
          - type: custom:mushroom-entity-card
            entity: sensor.kems_predicted_net_value
            name: Predicted net value
            icon: mdi:cash-fast
          - type: custom:mushroom-entity-card
            entity: sensor.kems_actual_value_created_today
            name: Value today
            icon: mdi:cash-plus
          - type: custom:mushroom-entity-card
            entity: sensor.kems_actual_value_created_total
            name: Lifetime value
            icon: mdi:piggy-bank
          - type: custom:mushroom-entity-card
            entity: sensor.kems_actual_net_profit
            name: Profit after payback
            icon: mdi:trending-up

      - type: custom:apexcharts-card
        header:
          show: true
          title: Investment recovery and profit
          show_states: true
        graph_span: 5y
        series:
          - entity: sensor.kems_actual_value_created_total
            name: Actual system value
            type: area
            group_by:
              duration: 1d
              func: last
          - entity: sensor.kems_lifetime_simulated_system_value
            name: Simulated value
            type: line
            group_by:
              duration: 1d
              func: last
          - entity: sensor.kems_actual_net_profit
            name: Profit
            type: area
            group_by:
              duration: 1d
              func: last

  - title: Lifetime energy
    path: lifetime-energy
    icon: mdi:all-inclusive
    type: masonry
    cards:
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_solar_generation
            name: Solar generated
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_house_consumption
            name: House electricity
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_grid_import
            name: Grid imported
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_grid_export
            name: Grid exported
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_battery_charge
            name: Battery charged
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_battery_discharge
            name: Battery discharged
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_ev_energy
            name: EV charging
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_gas_consumption
            name: Gas consumed

      - type: custom:apexcharts-card
        header:
          show: true
          title: All-time energy totals
        graph_span: 1y
        series:
          - entity: sensor.kems_lifetime_house_consumption
            name: House electricity
            group_by:
              duration: 1d
              func: last
          - entity: sensor.kems_lifetime_solar_generation
            name: Solar
            group_by:
              duration: 1d
              func: last
          - entity: sensor.kems_lifetime_grid_import
            name: Import
            group_by:
              duration: 1d
              func: last
          - entity: sensor.kems_lifetime_grid_export
            name: Export
            group_by:
              duration: 1d
              func: last
          - entity: sensor.kems_lifetime_gas_consumption
            name: Gas
            group_by:
              duration: 1d
              func: last

  - title: Lifetime finances
    path: lifetime-finances
    icon: mdi:cash-register
    type: masonry
    cards:
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_import_cost
            name: Import cost
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_gas_cost
            name: Gas cost
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_export_income
            name: Export income
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_avoided_import_value
            name: Avoided import value
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_system_value
            name: System value
          - type: custom:mushroom-entity-card
            entity: sensor.kems_lifetime_total_energy_cost
            name: Net energy cost

      - type: custom:apexcharts-card
        header:
          show: true
          title: All-time costs, earnings and system value
        graph_span: 1y
        series:
          - entity: sensor.kems_lifetime_import_cost
            name: Import cost
            group_by:
              duration: 1d
              func: last
          - entity: sensor.kems_lifetime_gas_cost
            name: Gas cost
            group_by:
              duration: 1d
              func: last
          - entity: sensor.kems_lifetime_export_income
            name: Export income
            group_by:
              duration: 1d
              func: last
          - entity: sensor.kems_lifetime_system_value
            name: System value
            group_by:
              duration: 1d
              func: last
