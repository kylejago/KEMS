            entity: sensor.kems_agile_history_coverage
            name: Historical replay coverage
            icon: mdi:calendar-check-outline
          - type: entity
            entity: sensor.kems_full_kems_forecast_vs_agile_winner_365_days
            name: 365-day winner
            icon: mdi:trophy-outline
          - type: entity
            entity: sensor.kems_agile_advantage_365_days
            name: 365-day strategy advantage
          - type: entity
            entity: sensor.kems_agile_vs_fixed_12p_gain_365_days
            name: 365-day Agile tariff gain vs 12p
          - type: entity
            entity: sensor.kems_full_kems_forecast_vs_agile_winner_7_days
            name: 7-day winner
          - type: entity
            entity: sensor.kems_agile_advantage_7_days
            name: 7-day strategy advantage
          - type: entity
            entity: sensor.kems_full_kems_forecast_vs_agile_winner_30_days
            name: 30-day winner
          - type: entity
            entity: sensor.kems_agile_advantage_30_days
            name: 30-day strategy advantage
          - type: entity
            entity: sensor.kems_full_kems_forecast_vs_agile_winner_all_time
            name: All-time winner
          - type: entity
            entity: sensor.kems_agile_vs_fixed_12p_gain_all_time
            name: All-time Agile tariff gain vs 12p

      - type: markdown
        title: Historical coverage
        content: |
          {% set h = states.sensor.kems_agile_history_coverage %}
          **Settled replay history:** {{ h.state if h else 'Unavailable' }}  
          **Earliest settled day:** {{ h.attributes.earliest_settled_day if h else '—' }}  
          **Latest settled day:** {{ h.attributes.latest_settled_day if h else '—' }}  
          **Rolling 365-day coverage:** {{ h.attributes.rolling_365_coverage_percent if h else 0 }}%  
          **12-month result ready:** {{ h.attributes.twelve_month_ready if h else false }}

          KEMS does **not** invent missing historical house-load or strategy observations. The 365-day result becomes authoritative only when this reaches **365/365 valid daily replays**.

      - type: history-graph
        title: Cumulative Agile advantage
        hours_to_show: 168
        entities:
          - entity: sensor.kems_agile_advantage_today
            name: Today
          - entity: sensor.kems_agile_advantage_7_days
            name: 7 days

      - type: markdown
        title: Strategy and tariff comparison
        content: |
          {% set periods = state_attr('sensor.kems_agile_smart_export_plan', 'periods') or {} %}
          | Period | Days | Strategy winner | Agile strategy advantage | Agile tariff gain vs 12p | Full KEMS cost | Agile cost | Agile export income | Weighted Agile rate |
          |---|---:|---|---:|---:|---:|---:|---:|---:|
          {% for key in ['today','tomorrow','yesterday','7_days','30_days','365_days','all_time'] %}
          {% set p = periods.get(key, {}) %}
          {% set c = p.get('comparison', {}) %}
          {% set f = p.get('full_kems_forecast', {}) %}
          {% set a = p.get('agile_smart_export', {}) %}
          | {{ p.get('label', key) }} | {{ p.get('days_included', '—') }}{% if p.get('days_expected') %}/{{ p.get('days_expected') }}{% endif %} | {{ c.get('winner', 'Unavailable') }} | £{{ '%.2f'|format((c.get('agile_advantage_pence', 0)|float) / 100) }} | £{{ '%.2f'|format((a.get('gain_vs_fixed_12p_same_dispatch_pence', 0)|float) / 100) }} | £{{ '%.2f'|format((f.get('economic_net_cost_pence', 0)|float) / 100) }} | £{{ '%.2f'|format((a.get('economic_net_cost_pence', 0)|float) / 100) }} | £{{ '%.2f'|format((a.get('export_income_pence', 0)|float) / 100) }} | {{ a.get('weighted_achieved_export_rate_pence', '—') }} p/kWh |
          {% endfor %}

  - title: Agile Assumptions
    path: agile-assumptions
    icon: mdi:information-outline
    cards:
      - type: markdown
        content: |
          # Agile Smart Export model boundary
          - **Region:** L
          - **Price source:** live Octopus Agile Outgoing half-hourly export rates, including the product/tariff metadata returned by Octopus.
          - **Fixed comparison:** 12p/kWh benchmark retained alongside Agile results on the **exact same Agile dispatch**, isolating tariff value from strategy changes.
          - **365-day history:** the rolling 365-day result is explicitly coverage-gated. KEMS will show `x/365` and will not call the full 12-month result ready until all 365 daily replays are valid.
          - **Battery wear allowance:** 2p per discharged kWh for optimisation and headline economic comparison.
          - **Battery/inverter constraints:** uses the active KEMS `SimulationConfig`, including battery capacity, reserve SOC, charge/discharge efficiency, KH7 inverter limit, export limit, charge/discharge limits and configured site-import limit.
          - **Import safety:** Agile Smart Export will not deliberately create avoidable day-rate grid import simply to export the battery later.
          - **Solar decision:** surplus PV is stored only when a later Agile opportunity after charge/discharge losses and battery wear is more valuable than exporting now, or when reserve protection requires it.
          - **Negative Agile prices:** KEMS avoids deliberately exporting at a negative rate where storage/curtailment is physically available.
          - **Tomorrow:** forecast replay uses the KEMS learned hourly house-demand profile plus the KEMS solar forecast. Normal Intelligent off-peak timing/rates are used; unannounced extra Intelligent slots cannot be known in advance.
          - **Safety:** this is **simulation/shadow only**. It creates no FoxESS write commands and does not change the existing control commissioning boundary.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entity
            entity: sensor.kems_agile_smart_export_status
            name: Smart Export status
          - type: entity
            entity: sensor.kems_agile_price_data_quality
            name: Price data quality
          - type: entity
            entity: sensor.kems_agile_export_rate_now
            name: Current Region L rate
          - type: entity
            entity: sensor.kems_agile_history_coverage
            name: Historical coverage
          - type: entity
            entity: sensor.kems_full_kems_forecast_vs_agile_winner_tomorrow
            name: Tomorrow winner
          - type: entity
            entity: sensor.kems_agile_advantage_tomorrow
            name: Tomorrow Agile advantage
