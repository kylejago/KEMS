title: Full KEMS Forecast vs Agile Smart Export

views:
  - title: Forecast vs Agile
    path: forecast-vs-agile
    icon: mdi:compare-horizontal
    cards:
      - type: markdown
        content: |
          # Full KEMS Forecast vs Agile Smart Export
          **Agile Smart Export** is a simulation-only strategy using the real Octopus Agile Outgoing half-hour export prices for **Region L**. It never writes to the FoxESS system.

          **Full KEMS Forecast** keeps the normal forecast-aware fixed-export strategy. **Agile Smart Export** uses the same battery, inverter, house-load, solar, reserve and import-safety limits, but can hold exportable energy for higher-value Agile slots and store solar when exporting it later is worth more after efficiency losses and battery wear.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entity
            entity: sensor.kems_full_kems_forecast_vs_agile_winner_today
            name: Winner today
            icon: mdi:trophy-outline
          - type: entity
            entity: sensor.kems_agile_advantage_today
            name: Agile strategy advantage today
            icon: mdi:cash-plus
          - type: entity
            entity: sensor.kems_agile_vs_fixed_12p_gain_today
            name: Agile tariff gain vs fixed 12p today
            icon: mdi:compare-horizontal
          - type: entity
            entity: sensor.kems_agile_export_rate_now
            name: Region L Agile rate now
            icon: mdi:chart-line
          - type: entity
            entity: sensor.kems_agile_price_data_quality
            name: Agile price coverage
            icon: mdi:database-check-outline
          - type: entity
            entity: sensor.kems_agile_history_coverage
            name: Historical replay coverage
            icon: mdi:calendar-check-outline

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: Strategy economics today
            show_header_toggle: false
            entities:
              - entity: sensor.kems_full_kems_forecast_comparison_cost_today
                name: Full KEMS Forecast
              - entity: sensor.kems_agile_smart_export_cost_today
                name: Agile Smart Export
              - entity: sensor.kems_agile_smart_export_export_income_today
                name: Agile export income
              - entity: sensor.kems_agile_smart_export_weighted_rate_today
                name: Weighted achieved export rate
          - type: entities
            title: Tariff-only benchmark today
            show_header_toggle: false
            entities:
              - entity: sensor.kems_agile_vs_fixed_12p_gain_today
                name: Agile income gain vs fixed 12p
              - entity: sensor.kems_fixed_12p_same_dispatch_income_today
                name: Fixed 12p income on same dispatch
              - entity: sensor.kems_agile_smart_export_export_income_today
                name: Actual Agile income on dispatch
              - entity: sensor.kems_agile_export_rate_now
                name: Current Region L rate

      - type: entities
        title: Smart Export now
        show_header_toggle: false
        entities:
          - entity: sensor.kems_agile_smart_export_status
            name: Smart Export status
          - entity: sensor.kems_agile_smart_export_plan
            name: Current Smart Export action
          - entity: sensor.kems_agile_export_rate_now
            name: Current Region L rate
          - entity: sensor.kems_agile_advantage_today
            name: Advantage vs Full KEMS Forecast

      - type: history-graph
        title: Live Region L Agile export rate
        hours_to_show: 24
        entities:
          - entity: sensor.kems_agile_export_rate_now
            name: Agile Outgoing

      - type: markdown
        title: Today's detail
        content: |
          {% set plan = state_attr('sensor.kems_agile_smart_export_plan', 'periods') or {} %}
          {% set today = plan.get('today', {}) %}
          {% set agile = today.get('agile_smart_export', {}) %}
          {% set full = today.get('full_kems_forecast', {}) %}
          | Metric | Full KEMS Forecast | Agile Smart Export |
          |---|---:|---:|
          | Net economic cost | £{{ '%.2f'|format((full.get('economic_net_cost_pence', 0)|float) / 100) }} | £{{ '%.2f'|format((agile.get('economic_net_cost_pence', 0)|float) / 100) }} |
          | Import cost | £{{ '%.2f'|format((full.get('import_cost_pence', 0)|float) / 100) }} | £{{ '%.2f'|format((agile.get('import_cost_pence', 0)|float) / 100) }} |
          | Export income | £{{ '%.2f'|format((full.get('export_income_pence', 0)|float) / 100) }} | £{{ '%.2f'|format((agile.get('export_income_pence', 0)|float) / 100) }} |
          | Fixed 12p income on Agile dispatch | — | £{{ '%.2f'|format((agile.get('fixed_12p_same_dispatch_income_pence', 0)|float) / 100) }} |
          | Agile tariff gain vs fixed 12p | — | £{{ '%.2f'|format((agile.get('gain_vs_fixed_12p_same_dispatch_pence', 0)|float) / 100) }} |
          | Grid import | {{ full.get('grid_import_kwh', '—') }} kWh | {{ agile.get('grid_import_kwh', '—') }} kWh |
          | Grid export | {{ full.get('grid_export_kwh', '—') }} kWh | {{ agile.get('grid_export_kwh', '—') }} kWh |
          | Solar export | {{ full.get('solar_export_kwh', '—') }} kWh | {{ agile.get('solar_export_kwh', '—') }} kWh |
          | Solar → battery | {{ full.get('solar_to_battery_kwh', '—') }} kWh | {{ agile.get('solar_to_battery_kwh', '—') }} kWh |
          | Battery → home | {{ full.get('battery_to_home_kwh', '—') }} kWh | {{ agile.get('battery_to_home_kwh', '—') }} kWh |
          | Battery export | {{ full.get('battery_export_kwh', '—') }} kWh | {{ agile.get('battery_export_kwh', '—') }} kWh |
          | Battery wear allowance | £{{ '%.2f'|format((full.get('battery_wear_cost_pence', 0)|float) / 100) }} | £{{ '%.2f'|format((agile.get('battery_wear_cost_pence', 0)|float) / 100) }} |

          *The strategy winner uses net energy cost plus the configured simulation battery-wear allowance. The fixed-12p comparison uses the exact same Agile dispatch, so it isolates tariff value rather than dispatch changes.*

  - title: Agile Price Plan
    path: agile-price-plan
    icon: mdi:chart-timeline-variant
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: entity
            entity: sensor.kems_agile_price_data_quality
            name: Price coverage
            icon: mdi:database-check-outline
          - type: entity
            entity: sensor.kems_agile_export_rate_now
            name: Current Region L rate
            icon: mdi:chart-line
          - type: entity
            entity: sensor.kems_agile_smart_export_status
            name: Smart Export status
            icon: mdi:shield-check-outline
          - type: entity
            entity: sensor.kems_agile_smart_export_plan
            name: Current Smart Export action
            icon: mdi:transmission-tower-export

      - type: markdown
        title: Today — actual Region L Agile prices and Smart Export plan
        content: |
          {% set slots = state_attr('sensor.kems_agile_smart_export_plan', 'today_slots') or [] %}
          {% if slots %}
          | Time | Agile p/kWh | Action | Grid export | Battery export | End SOC |
          |---|---:|---|---:|---:|---:|
          {% for p in slots %}
          | {{ p.get('label', '') }} | {{ '%.2f'|format(p.get('rate_pence', 0)|float) }} | {{ (p.get('actions') or ['future slot'])|join(', ') }} | {{ p.get('grid_export_kwh') if p.get('grid_export_kwh') is not none else '—' }} | {{ p.get('battery_export_kwh') if p.get('battery_export_kwh') is not none else '—' }} | {{ (p.get('ending_soc_percent') ~ '%') if p.get('ending_soc_percent') is not none else '—' }} |
          {% endfor %}
          {% else %}
          No Region L Agile price slots have been loaded yet.
          {% endif %}

      - type: markdown
        title: Tomorrow — published prices and forecast plan
        content: |
          {% set slots = state_attr('sensor.kems_agile_smart_export_plan', 'tomorrow_slots') or [] %}
          {% if slots %}
          | Time | Agile p/kWh | Planned action | Grid export | Battery export | End SOC |
          |---|---:|---|---:|---:|---:|
          {% for p in slots %}
          | {{ p.get('label', '') }} | {{ '%.2f'|format(p.get('rate_pence', 0)|float) }} | {{ (p.get('actions') or ['future slot'])|join(', ') }} | {{ p.get('grid_export_kwh') if p.get('grid_export_kwh') is not none else '—' }} | {{ p.get('battery_export_kwh') if p.get('battery_export_kwh') is not none else '—' }} | {{ (p.get('ending_soc_percent') ~ '%') if p.get('ending_soc_percent') is not none else '—' }} |
          {% endfor %}
          {% else %}
          Tomorrow's Agile slots are not published yet. KEMS will populate this table when Octopus publishes the next day's Region L prices.
          {% endif %}

      - type: entities
        title: Price feed diagnostics
        show_header_toggle: false
        entities:
          - sensor.kems_agile_price_data_quality
          - sensor.kems_agile_export_rate_now
          - sensor.kems_agile_smart_export_status

