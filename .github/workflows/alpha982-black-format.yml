name: Alpha9.82 temporary Black formatter

on:
  push:
    branches:
      - "fix/alpha9.82-midnight-plan-continuity"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha9.82-midnight-plan-continuity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Apply Black
        run: python -m black .
      - name: Commit formatter result
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Alpha9.82: apply Black formatting"
          git push origin HEAD:fix/alpha9.82-midnight-plan-continuity
