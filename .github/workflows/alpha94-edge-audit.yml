name: Alpha9.4 stale SOC edge audit

on:
  push:
    branches:
      - fix/alpha9.4-simulation-commissioning-separation
    paths:
      - .github/workflows/alpha94-edge-audit.yml
      - tools/alpha94_edge_audit.py

permissions:
  contents: write

jobs:
  audit-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha9.4-simulation-commissioning-separation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply stale-SOC edge audit
        run: python tools/alpha94_edge_audit.py

      - name: Format candidate
        run: python -m black custom_components/kems/kems_core/simulation.py tests/test_alpha94_simulation_commissioning_separation.py

      - name: Packaged dashboard is current
        run: python scripts/sync_packaged_dashboard.py --check

      - name: Black
        run: python -m black --check --diff .

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: Compile Python source
        run: python -m compileall -q custom_components tests

      - name: Prove FoxESS write boundary remains closed
        run: |
          ! grep -q 'services.async_call' custom_components/kems/foxess_command_shadow.py
          ! grep -q 'write_register' custom_components/kems/foxess_command_shadow.py
          ! grep -q 'async_set_native_value' custom_components/kems/foxess_command_shadow.py

      - name: Commit audited product candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && { echo 'No audited changes produced'; exit 1; }
          git commit -m "Alpha9.4: keep stale physical SOC out of virtual replay"
          git push origin HEAD:fix/alpha9.4-simulation-commissioning-separation
