name: Alpha9.2 corrected gated implementation

on:
  push:
    branches:
      - feature/alpha9.2-happy-hour-hourly-cap-ohme
    paths:
      - .github/workflows/alpha9.2-run-corrected-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha9.2-happy-hour-hourly-cap-ohme
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply corrected Alpha9.2 implementation in memory
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/alpha9.2-happy-hour-control-migration.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script_lines = []
          for line in lines[start:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(script_lines) + '\n'

          broken = r"h  \\n          **Automatic source:**"
          fixed = r"h  \n          **Automatic source:**"
          if script.count(broken) != 1:
              raise SystemExit(f'expected one escaped Happy Hour marker, found {script.count(broken)}')
          script = script.replace(broken, fixed, 1)

          broad = 'assert "foxess" not in source.casefold()'
          narrow = 'assert "from .foxess" not in source\n    assert "FoxESSCommand" not in source'
          if script.count(broad) != 2:
              raise SystemExit(f'expected two over-broad FoxESS assertions, found {script.count(broad)}')
          script = script.replace(broad, narrow)

          exec(compile(script, '<alpha9.2-staging>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Sync packaged dashboard
        run: python scripts/sync_packaged_dashboard.py

      - name: Format touched Python
        run: |
          python -m black \
            custom_components/kems/happy_hour_budget.py \
            custom_components/kems/happy_hour_ohme_control.py \
            custom_components/kems/const.py \
            custom_components/kems/agile_alpha7_compat.py \
            custom_components/kems/agile_control_alignment.py \
            custom_components/kems/kems_core/ev_charge_policy.py \
            custom_components/kems/ev_policy_dashboard.py \
            custom_components/kems/switch.py \
            custom_components/kems/happy_hour_auto.py \
            custom_components/kems/coordinator.py \
            custom_components/kems/diagnostics.py \
            custom_components/kems/__init__.py \
            tests/test_ev_charge_policy.py \
            tests/test_alpha9_baseline.py \
            tests/test_alpha9_2_happy_hour.py

      - name: Packaged dashboard is current
        run: python scripts/sync_packaged_dashboard.py --check

      - name: Black
        run: python -m black --check --diff .

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: Compile Python source
        run: python -m compileall -q custom_components tests

      - name: Commit product files only after complete green gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing to commit workflow changes from the runner'
            exit 1
          fi
          git commit -m "Alpha9.2: enforce hourly Happy Hour cap and opt-in Ohme control"
          git push origin HEAD:feature/alpha9.2-happy-hour-hourly-cap-ohme
