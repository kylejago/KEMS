name: Alpha9.48 solar local-day cleanup

on:
  push:
    branches:
      - fix/alpha9.48-foxess-daily-energy-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha9.48-foxess-daily-energy-authority
      - name: Align Alpha9.46 solar authority to Home Assistant local day
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/kems/alpha946_solar_actual.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('if record.timestamp.date() != target_date:',
               'if dt_util.as_local(record.timestamp).date() != target_date:'),
              ('candidates = [item for item in candidates if item[0].hour >= 23]',
               'candidates = [\n            item for item in candidates if dt_util.as_local(item[0]).hour >= 23\n        ]'),
              ('direct = _direct_for_day(records, now.date(), current_snapshot)',
               'direct = _direct_for_day(\n            records, dt_util.as_local(now).date(), current_snapshot\n        )'),
              ('if now.date() == dt_util.now().date():',
               'if dt_util.as_local(now).date() == dt_util.as_local(dt_util.now()).date():'),
              ('if now.date() == dt_util.now().date():',
               'if dt_util.as_local(now).date() == dt_util.as_local(dt_util.now()).date():'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected Alpha9.46 source text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/alpha948-solar-local-day-cleanup.yml').unlink()
          PY
      - name: Commit local-day correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Alpha9.48: align retained solar evidence to local day'
          git push origin HEAD:fix/alpha9.48-foxess-daily-energy-authority
