name: Fix panel startup globals once

on:
  push:
    branches:
      - feature/panel-startup-animation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Add startup globals
        run: python scripts/fix_panel_startup_globals_once.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/kems16x16.yaml
          git commit -m "Fix panel startup animation globals"
          git push
