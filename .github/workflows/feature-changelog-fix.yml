name: Feature changelog cleanup

on:
  push:
    branches:
      - feature/agile-smart-export

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Restore FoxESS changelog wording') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agile-smart-export
          fetch-depth: 0

      - name: Restore unchanged historical wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = '- Real hardware writes remain disabled.\n\n## 0.7.0-alpha3 — KH7 topology'
          new = '- Real FoxESS writes remain disabled.\n\n## 0.7.0-alpha3 — KH7 topology'
          if old not in text:
              raise SystemExit('Expected historical changelog line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Restore FoxESS changelog wording"
          git push origin HEAD:feature/agile-smart-export
