name: Fix manual update state once

on:
  push:
    branches:
      - feature/unified-update-orchestrator
    paths:
      - .github/workflows/fix-manual-update-state-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-update-orchestrator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/fix_manual_update_state_once.py
      - run: python -m pip install black==26.5.1 ruff==0.16.0
      - run: |
          python -m black custom_components/kems/update_orchestrator.py
          python -m ruff check custom_components/kems/update_orchestrator.py
      - name: Commit update-state fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep manual updates distinct from scheduled maintenance"
          git push
