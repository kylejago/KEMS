name: Format alpha7.19 branch

on:
  push:
    branches:
      - feature/alpha7.19-validation-shadow

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[black-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha7.19-validation-shadow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Black
        run: python -m pip install black==26.5.1
      - name: Format alpha7.19 files
        run: |
          python -m black \
            custom_components/kems/agile_alpha719_validation.py \
            custom_components/kems/kems_core/shadow_validation.py \
            custom_components/kems/shadow_validation.py \
            tests/test_agile_alpha719.py \
            tests/test_dashboard_consolidation.py
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/agile_alpha719_validation.py \
                  custom_components/kems/kems_core/shadow_validation.py \
                  custom_components/kems/shadow_validation.py \
                  tests/test_agile_alpha719.py \
                  tests/test_dashboard_consolidation.py
          git commit -m "Format alpha7.19 with Black [black-formatted]"
          git push origin HEAD:feature/alpha7.19-validation-shadow
