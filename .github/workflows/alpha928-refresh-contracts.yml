name: Alpha9.28 refresh panel contracts

on:
  push:
    branches:
      - feat/alpha9.28-panel-v2-staggered-flow
    paths:
      - .github/workflows/alpha928-refresh-contracts.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alpha9.28-panel-v2-staggered-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh current panel contracts
        run: python scripts/alpha928_refresh_panel_contracts.py
      - name: Commit contract refresh
        run: |
          git diff --check
          git config user.name "kylejago"
          git config user.email "43718551+kylejago@users.noreply.github.com"
          git add tests
          git commit -m "Alpha9.28: refresh panel.2 successor contracts"
          git push origin HEAD:feat/alpha9.28-panel-v2-staggered-flow
