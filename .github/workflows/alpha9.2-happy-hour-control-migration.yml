          )
          replace_once(
              KEMS / 'coordinator.py',
              '    async def async_shutdown(self) -> None:\n        """Flush retained KEMS state before unloading."""\n        await self._history.async_save()\n',
              '    async def async_shutdown(self) -> None:\n        """Flush retained KEMS state before unloading."""\n        await self._happy_hour_ohme.async_shutdown()\n        await self._history.async_save()\n',
          )
          replace_once(
              KEMS / 'coordinator.py',
              '    @property\n    def agile_history_backfill_state(self) -> dict:\n',
              '    @property\n    def happy_hour_ohme_control_state(self) -> dict:\n        """Return the narrow Happy Hour Ohme-control audit state."""\n        return self._happy_hour_ohme.status\n\n    @property\n    def agile_history_backfill_state(self) -> dict:\n',
          )

          # Diagnostics explicitly distinguish the Ohme exception from blocked FoxESS writes.
          replace_once(
              KEMS / 'diagnostics.py',
              '        "agile_smart_export": coordinator.agile_smart_export_state,\n',
              '        "agile_smart_export": coordinator.agile_smart_export_state,\n        "happy_hour_ohme_control": coordinator.happy_hour_ohme_control_state,\n',
          )

          replace_once(
              KEMS / '__init__.py',
              '        "KEMS initialised with read-only control lab; real hardware writes are blocked"\n',
              '        "KEMS initialised; FoxESS writes remain blocked and Happy Hour Ohme control is explicit opt-in"\n',
          )

          # Regression: raw daytime Intelligent is inert, confirmed dispatch is valid cheap authority.
          ev_test = ROOT / 'tests/test_ev_charge_policy.py'
          marker = '''def test_default_negative_daytime_price_does_not_authorise_ev() -> None:\n'''
          addition = '''def test_confirmed_daytime_intelligent_dispatch_authorises_ev() -> None:\n    state = ControlEngine().plan(\n        _snapshot(\n            intelligent_slot=True,\n            ev_charging=True,\n            intelligent_slot_evidence={"large_import_permitted": True},\n        ),\n        _simulation(),\n        NOW,\n        ControlConfig(),\n    )\n    assert state.desired_ev_charging_allowed is True\n    assert state.desired_total_discharge_power_kw == 0.0\n\n\n'''
          replace_once(ev_test, marker, addition + marker)

          # Current Alpha9 contracts: KEMS advances alone, and only the narrow Ohme path writes.
          alpha9 = ROOT / 'tests/test_alpha9_baseline.py'
          replace_once(alpha9, 'assert manifest["version"] == "0.9.0-alpha9.1"', 'assert manifest["version"] == "0.9.0-alpha9.2"')
          replace_once(
              alpha9,
              'def test_alpha9_baseline_cannot_enable_real_hardware_writes() -> None:\n',
              'def test_alpha9_foxess_write_boundary_remains_closed() -> None:\n',
          )
          with alpha9.open('a', encoding='utf-8') as handle:
              handle.write(textwrap.dedent(r'''

              def test_alpha9_2_ohme_write_is_narrow_and_explicitly_opt_in() -> None:
                  source = (KEMS / "happy_hour_ohme_control.py").read_text(encoding="utf-8")
                  assert "CONF_HAPPY_HOUR_OHME_CONTROL_ENABLED" in source
                  assert 'happy_hour.get("source") == "octopus_energy"' in source
                  assert '"select",' in source and '"select_option",' in source
                  assert "foxess" not in source.casefold()
              '''))

          # Coordinated release metadata: KEMS only; the other three tracks remain .0.
          replace_once(
              ROOT / 'release/kems-bundle.template.json',
              'Alpha9 coordinated parity baseline; Alpha9.1 KEMS-only dashboard presentation patch: keep dynamic Component verification and Recent updates Markdown rows contiguous so Home Assistant renders them as tables; Pi Web remains 0.9.0-alpha9-web.0, Public Web remains 0.9.0-alpha9-public.0, Panel remains 0.9.0-alpha9-panel.0, the canonical 15% optimisation target / 10% hard floor / 12% recovery battery safety policy is unchanged; FoxESS hardware writes hard-blocked until physical commissioning is complete',
              'Alpha9 coordinated parity baseline; Alpha9.2 KEMS-only Happy Hour policy/control patch: enforce an independent 16 kWh cap in every reward hour with no carry or borrowing, reserve maximum useful battery charge first, protect home demand, expose only the remainder to EV charging, and fall back immediately to normal tariff logic when the current reward-hour cap is exhausted; confirmed Intelligent extra slots remain valid cheap authority, raw/unconfirmed slots remain inert; optional Ohme Max charge control is explicit opt-in and automatic-Happy-Hour-only with previous-mode restoration; Pi Web remains 0.9.0-alpha9-web.0, Public Web remains 0.9.0-alpha9-public.0, Panel remains 0.9.0-alpha9-panel.0; canonical 15% optimisation target / 10% hard floor / 12% recovery remains unchanged; FoxESS hardware writes hard-blocked until physical commissioning is complete',
          )

          docs = ROOT / 'docs/ALPHA9.md'
          docs.write_text(
              docs.read_text(encoding='utf-8')
              + textwrap.dedent(r'''

              ## Alpha9.2 KEMS-only Happy Hour policy/control patch

              - KEMS: `0.9.0-alpha9.2`
              - Pi Web remains: `0.9.0-alpha9-web.0`
              - Public Web remains: `0.9.0-alpha9-public.0`
              - Panel remains: `0.9.0-alpha9-panel.0`

              Alpha9.2 makes Weekend Happy Hour a strict per-reward-hour import authority. Every booked reward hour has its own **16 kWh** cap. Unused allowance does not carry into the next hour and a later reward hour cannot be borrowed early. The active-hour budget reserves the maximum useful battery charge first, protects projected non-EV home import next, and exposes only the remainder to EV charging. Once the current reward-hour ledger reaches 16 kWh, Happy Hour authority ends for the rest of that reward hour and KEMS immediately returns to normal tariff logic; an independently confirmed overnight/Intelligent cheap authority may still permit import, but Happy Hour alone cannot cause paid expensive import beyond its cap.

              The default EV policy continues to allow the configured overnight cheap window plus a daytime Intelligent dispatch only after KEMS' existing fail-closed multi-signal confirmation. Raw/stale Intelligent flags and Agile price alone do not authorise EV charging. Happy Hour is separate from Intelligent dispatch authority.

              Alpha9.2 also adds an explicit opt-in **Happy Hour Ohme control** switch. When enabled, KEMS may temporarily select the Ohme `Max charge` mode only for an automatically verified active Octopus Happy Hour with a complete hourly import ledger, a healthy safety envelope and sufficient allowance remaining after the battery/home reserve. KEMS preserves the pre-event Ohme mode and restores it when its Happy Hour authority ends. Manual Happy Hour fallback remains planning/shadow only and cannot start the car. Slow scans, Power Down, emergency stop, island operation, stale/unsafe data or an incomplete reward ledger all fail closed.

              This is the only new physical/cloud write path in Alpha9.2. **FoxESS writes remain hard-blocked** pending physical commissioning and parity proof.
              '''),
              encoding='utf-8',
          )
          PY

