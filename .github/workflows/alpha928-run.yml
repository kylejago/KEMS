name: Alpha9.28 guarded panel migration

on:
  push:
    branches:
      - feat/alpha9.28-panel-v2-staggered-flow
    paths:
      - .github/workflows/alpha928-run.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alpha9.28-panel-v2-staggered-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply guarded migration
        run: python scripts/alpha928_apply.py
      - name: Commit guarded migration
        run: |
          git diff --check
          git config user.name "kylejago"
          git config user.email "43718551+kylejago@users.noreply.github.com"
          git add custom_components/kems/kems16x16.yaml custom_components/kems/panel.py custom_components/kems/manifest.json release/kems-bundle.template.json tests
          git commit -m "Alpha9.28: stagger V2 panel flow packets"
          git push origin HEAD:feat/alpha9.28-panel-v2-staggered-flow
