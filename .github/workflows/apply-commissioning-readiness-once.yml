name: Apply commissioning readiness once

on:
  push:
    branches:
      - feature/commissioning-readiness-panel-health

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commissioning-readiness-panel-health
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply commissioning readiness patch
        run: python scripts/apply_commissioning_readiness_once.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/sensor.py custom_components/kems/kems16x16.yaml dashboards/kems_master_dashboard.yaml custom_components/kems/kems_master_dashboard.yaml tests/test_managed_dashboard.py tests/test_managed_panel.py
          git commit -m "Apply commissioning readiness dashboard and panel hooks"
          git push
