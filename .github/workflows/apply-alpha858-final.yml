name: Apply Alpha8.58 final patch

on:
  push:
    branches:
      - alpha8.58-intelligent-cheap-confirmation
    paths:
      - tools/apply-alpha858-final.py
      - .github/workflows/apply-alpha858-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded Alpha8.58 changes
        run: python tools/apply-alpha858-final.py
      - name: Commit clean candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Alpha8.58: finish Intelligent routing and solar charge priority"
          git push
