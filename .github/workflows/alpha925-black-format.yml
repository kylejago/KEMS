name: Alpha9.25 Black format

on:
  push:
    branches:
      - fix/alpha9.25-observability-clarity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha9.25-observability-clarity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Black
        run: python -m pip install black==26.5.1
      - name: Format
        run: python -m black .
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo 'No Black changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply Black 26.5.1'
          git push origin HEAD:fix/alpha9.25-observability-clarity
