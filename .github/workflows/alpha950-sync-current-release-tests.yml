name: Alpha9.50 sync current release tests

on:
  push:
    branches:
      - fix/alpha9.50-dashboard-event-cards

permissions:
  contents: write

jobs:
  sync-current-release-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha9.50-dashboard-event-cards

      - name: Update stale current-release assertions
        shell: python
        run: |
          from pathlib import Path

          paths = [
              "tests/test_alpha8_consolidation.py",
              "tests/test_alpha913_forecast_path_scheduler.py",
              "tests/test_alpha919_runtime_recorder_owner.py",
              "tests/test_alpha920_shadow_recorder_owner.py",
              "tests/test_alpha921_planning_target_house_floor.py",
              "tests/test_alpha922_flow_contract_startup.py",
              "tests/test_alpha924_flow_parity_export_floor.py",
              "tests/test_alpha925_observability_clarity.py",
              "tests/test_alpha926_panel_layout_profiles.py",
              "tests/test_alpha927_policy_label_publication.py",
              "tests/test_alpha928_panel_v2_staggered_flow.py",
              "tests/test_alpha929_panel_v2_extra_gap.py",
              "tests/test_alpha930_live_foxess_solar_commissioning.py",
              "tests/test_alpha946_solar_actual_authority.py",
              "tests/test_alpha9_baseline.py",
          ]
          changed = 0
          for raw in paths:
              path = Path(raw)
              before = path.read_text(encoding="utf-8")
              after = before.replace("0.9.0-alpha9.49", "0.9.0-alpha9.50")
              after = after.replace('reason.startswith("Alpha9.49")', 'reason.startswith("Alpha9.50")')
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  changed += 1
          if changed != len(paths):
              raise SystemExit(f"expected to update {len(paths)} files, updated {changed}")
          print(f"updated {changed} current-release assertion files")

      - name: Commit assertion sync and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/alpha950-sync-current-release-tests.yml
          git add tests
          git commit -m "Alpha9.50: sync current release assertions"
          git push origin HEAD:fix/alpha9.50-dashboard-event-cards
