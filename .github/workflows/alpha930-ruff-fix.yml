name: Alpha9.30 lint fix

on:
  push:
    branches:
      - feature/alpha9.30-live-foxess-solar-commissioning
    paths:
      - .github/workflows/alpha930-ruff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact lint fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('custom_components/kems/commissioning.py')
          s = p.read_text()
          old = '            "Battery installation pending — sign proof deferred until the pack is fitted",\n'
          new = '            "Battery installation pending — battery sign proof deferred",\n'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/commissioning.py
          git diff --cached --check
          git commit -m "style: satisfy Alpha9.30 commissioning lint"
          git push origin HEAD:feature/alpha9.30-live-foxess-solar-commissioning
