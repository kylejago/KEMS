name: Publish KEMS release automatically

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-kems-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Gate publication on exact-commit Validate, HACS and hassfest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # All three independent workflows must succeed for this main commit.
          # Validate includes the full pytest suite and ESPHome panel compile.
          # Never rely on a previously green PR head or an unrelated main run.
          for workflow in validate.yml hacs.yml hassfest.yml; do
            verified=false
            for attempt in $(seq 1 120); do
              runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" --commit "$GITHUB_SHA" --event push \
                --limit 20 --json databaseId,headSha,status,conclusion,event)"
              result="$(RUNS_JSON="$runs" EXPECTED_SHA="$GITHUB_SHA" python - <<'PY'
          import json
          import os

          runs = json.loads(os.environ["RUNS_JSON"])
          exact = [
              row for row in runs
              if row.get("headSha") == os.environ["EXPECTED_SHA"]
              and row.get("event") == "push"
          ]
          if not exact:
              print("pending")
          else:
              current = exact[0]
              if current.get("status") != "completed":
                  print("pending")
              elif current.get("conclusion") == "success":
                  print("success")
              else:
                  print("failure")
          PY
              )"
              case "$result" in
                success)
                  echo "$workflow succeeded on $GITHUB_SHA"
                  verified=true
                  break
                  ;;
                failure)
                  echo "$workflow failed on $GITHUB_SHA; no KEMS release will be created." >&2
                  exit 1
                  ;;
                pending)
                  sleep 20
                  ;;
                *)
                  echo "Unexpected $workflow state: $result" >&2
                  exit 1
                  ;;
              esac
            done
            if [[ "$verified" != true ]]; then
              echo "$workflow did not pass on the exact commit; publication blocked." >&2
              exit 1
            fi
          done
          # Serialised publisher jobs must not release an older commit after
          # a newer change to main has arrived during validation.
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "main advanced since validation; refusing stale release." >&2
            exit 1
          fi

      - name: Resolve canonical KEMS version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/kems/manifest.json").read_text())
          print(str(manifest["version"]).strip())
          PY
          )"
          if [[ -z "$VERSION" || "$VERSION" == v* ]]; then
            echo "KEMS releases require an exact version with no leading v: $VERSION" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid KEMS release version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create canonical release when missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # An existing version must never be silently re-used for a changed
            # main commit, or have its immutable release assets overwritten.
            git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
            existing_commit="$(git rev-parse "$VERSION^{commit}")"
            if [[ "$existing_commit" != "$GITHUB_SHA" ]]; then
              echo "Version $VERSION already targets $existing_commit; bump the manifest first." >&2
              exit 1
            fi
            echo "Release $VERSION already exists at this exact commit."
            exit 0
          fi

          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "KEMS $VERSION" \
            --generate-notes \
            "${PRERELEASE_ARGS[@]}"

      - name: Check out exact release tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          git checkout --detach "$VERSION"

      - name: Render exact coordinated bundle
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python scripts/render_update_bundle.py \
            --release-version "$VERSION" \
            --output kems-bundle.json
          sha256sum kems-bundle.json > kems-bundle.json.sha256

      - name: Attach verified bundle to canonical release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release upload "$VERSION" \
            kems-bundle.json \
            kems-bundle.json.sha256 \
            --clobber
