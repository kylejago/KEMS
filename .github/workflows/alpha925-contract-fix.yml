name: Alpha9.25 contract fix

on:
  push:
    branches:
      - fix/alpha9.25-observability-clarity

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Alpha9.25 successor contract fixes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          version_files = [
              "tests/test_alpha8_consolidation.py",
              "tests/test_alpha913_forecast_path_scheduler.py",
              "tests/test_alpha919_runtime_recorder_owner.py",
              "tests/test_alpha920_shadow_recorder_owner.py",
              "tests/test_alpha921_planning_target_house_floor.py",
              "tests/test_alpha922_flow_contract_startup.py",
              "tests/test_alpha924_flow_parity_export_floor.py",
              "tests/test_alpha9_baseline.py",
          ]
          old_version = '"0.9.0-alpha9.24"'
          new_version = '"0.9.0-alpha9.25"'
          for relative in version_files:
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              count = text.count(old_version)
              if count != 1:
                  raise RuntimeError(
                      f"Expected exactly one current-release Alpha9.24 assertion in {relative}; found {count}"
                  )
              path.write_text(text.replace(old_version, new_version, 1), encoding="utf-8")

          alpha925_test = Path("tests/test_alpha925_observability_clarity.py")
          text = alpha925_test.read_text(encoding="utf-8")
          old_assertion = '    assert "absolute floor until cheap charge" in source\n'
          if text.count(old_assertion) != 1:
              raise RuntimeError("Alpha9.25 wording assertion did not match exactly once")
          new_assertions = (
              '    assert "absolute" in source\n'
              '    assert "floor until cheap charge; no deliberate export" in source\n'
          )
          alpha925_test.write_text(
              text.replace(old_assertion, new_assertions, 1), encoding="utf-8"
          )

          bundle_path = Path("release/kems-bundle.template.json")
          bundle = json.loads(bundle_path.read_text(encoding="utf-8"))
          bundle["maintenance"]["reason"] = (
              "Alpha9 coordinated parity baseline; Alpha9.25 is a KEMS-only observability clarity release after Alpha9.24 became fully LIVE-PROVEN. "
              "Correct final customer-facing reserve wording so the 15% planning target is identified as the deliberate-export stop, ordinary Home battery service is described as continuing toward the independent 10% absolute floor, and the restart-safe 12% recovery latch remains distinct. "
              "Add reporting-only cheap-window charge-capability evidence that states the maximum SOC physically achievable from the projected cheap-start SOC using the configured 7.0 kW KH7 charge limit, remaining cheap-window duration and charge efficiency, including whether the 100% charge target is physically reachable and any shortfall. "
              "Retain the Alpha9.24 flow parity export-floor correction and its 15% planning/export target, independent 10% absolute floor and restart-safe 12% recovery latch. "
              "Retain the Alpha9.22 startup hotfix at build_slot_flow that prevents the unexpected planning_target_soc_percent keyword failure at the flow-contract boundary. "
              "Retain Alpha9.13 forecast-aware scheduling, Alpha9.19 runtime Recorder hygiene, Alpha9.20 ShadowValidationRecorder Recorder hygiene and all prior Alpha9 behaviour. "
              "No optimiser allocation, tariff, Happy Hour, Power Down, SOC arithmetic or FoxESS command/write authority changes; Pi Web remains 0.9.0-alpha9-web.0, Public Web remains 0.9.0-alpha9-public.0, Panel remains 0.9.0-alpha9-panel.0; configured KH7 limits remain 7.0 kW; real FoxESS hardware writes remain hard-blocked until physical commissioning is complete."
          )
          bundle_path.write_text(json.dumps(bundle, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit exact contract fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_alpha8_consolidation.py \
            tests/test_alpha913_forecast_path_scheduler.py \
            tests/test_alpha919_runtime_recorder_owner.py \
            tests/test_alpha920_shadow_recorder_owner.py \
            tests/test_alpha921_planning_target_house_floor.py \
            tests/test_alpha922_flow_contract_startup.py \
            tests/test_alpha924_flow_parity_export_floor.py \
            tests/test_alpha925_observability_clarity.py \
            tests/test_alpha9_baseline.py \
            release/kems-bundle.template.json
          git commit -m "test: advance Alpha9.25 successor contracts"
          git push
