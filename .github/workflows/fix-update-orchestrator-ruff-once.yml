name: Fix update orchestrator Ruff once

on:
  push:
    branches:
      - feature/unified-update-orchestrator
    paths:
      - .github/workflows/fix-update-orchestrator-ruff-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-update-orchestrator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply Ruff/safety fixes
        run: python scripts/fix_update_orchestrator_ruff_once.py
      - name: Install format/lint tools
        run: python -m pip install black==26.5.1 ruff==0.16.0
      - name: Format and lint orchestrator
        run: |
          python -m black custom_components/kems/update_orchestrator.py
          python -m ruff check custom_components/kems/update_orchestrator.py
      - name: Commit final orchestrator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tighten coordinated update safety and lint"
          git push
