name: Alpha9.29 temporary migration

on:
  push:
    branches:
      - feature/alpha9.29-panel-v2-extra-gap

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha9.29-panel-v2-extra-gap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded Alpha9.29 migration
        run: python scripts/alpha929_migrate.py
      - name: Commit guarded migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/kems16x16.yaml custom_components/kems/manifest.json custom_components/kems/panel.py release/kems-bundle.template.json tests
          git diff --cached --quiet && { echo "No migration changes produced"; exit 1; }
          git commit -m "Alpha9.29: add one extra V2 flow gap"
          git push origin HEAD:feature/alpha9.29-panel-v2-extra-gap
