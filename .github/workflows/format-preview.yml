name: Format preview

on:
  push:
    branches:
      - feature/managed-panel-auto-ota

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Black
        run: python -m pip install black==26.5.1
      - name: Show Black changes
        run: |
          python -m black custom_components/kems/dashboard.py tests/test_managed_panel.py
          git diff -- custom_components/kems/dashboard.py tests/test_managed_panel.py
