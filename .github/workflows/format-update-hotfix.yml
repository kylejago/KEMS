name: Format updater hotfix

on:
  push:
    branches:
      - fix/update-hacs-exact-tag

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-hacs-exact-tag
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format changed Python files
        run: |
          python -m pip install black==26.5.1
          python -m black custom_components/kems/update_orchestrator.py tests/test_update_orchestrator.py
          python -m black --check custom_components/kems/update_orchestrator.py tests/test_update_orchestrator.py
          git diff --check
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-update-hotfix.yml
          git add custom_components/kems/update_orchestrator.py tests/test_update_orchestrator.py
          git commit -m "Format coordinated updater fix"
          git push origin HEAD:fix/update-hacs-exact-tag
