name: Alpha7.35 temporary formatter

on:
  push:
    branches:
      - feature/alpha7.35-product-types-dashboard

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha7.35-product-types-dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install black==26.5.1
      - name: Format Alpha7.35 files
        run: python -m black custom_components/kems/config_flow.py
      - name: Commit exact Black output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/config_flow.py
          git commit -m "Apply Black formatting to Alpha7.35 config flow"
          git push origin HEAD:feature/alpha7.35-product-types-dashboard
