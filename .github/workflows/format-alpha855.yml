name: Format Alpha8.55

on:
  push:
    branches:
      - feature/alpha8.55-routing-economics-shadow-parity
    paths:
      - scripts/format-alpha855.py
      - .github/workflows/format-alpha855.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha8.55-routing-economics-shadow-parity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply exact Black diff
        run: python scripts/format-alpha855.py
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/agile_control_alignment.py \
                  custom_components/kems/agile_smart_export.py \
                  tests/test_alpha855_routing_economics_shadow.py
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git commit -m "style: format Alpha8.55 changes"
          git push origin HEAD:feature/alpha8.55-routing-economics-shadow-parity
