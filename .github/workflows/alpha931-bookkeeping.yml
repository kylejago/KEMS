name: Alpha9.31 release guard alignment

on:
  push:
    branches:
      - fix/alpha9.31-foxess-static-freshness

permissions:
  contents: write

jobs:
  align-release-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/alpha9.31-foxess-static-freshness

      - name: Align current-release guards only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old = 'assert manifest["version"] == "0.9.0-alpha9.30"'
          new = 'assert manifest["version"] == "0.9.0-alpha9.31"'
          changed = []
          for path in sorted(Path("tests").glob("test_*.py")):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count:
                  if count != 1:
                      raise SystemExit(f"Expected one current-version guard in {path}, found {count}")
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(str(path))

          if len(changed) != 14:
              raise SystemExit(f"Expected 14 current-version guards, changed {len(changed)}: {changed}")

          bundle_path = Path("release/kems-bundle.template.json")
          bundle = json.loads(bundle_path.read_text(encoding="utf-8"))
          phrase = "Alpha9 coordinated parity baseline"
          reason = str(bundle["maintenance"]["reason"])
          if phrase not in reason:
              bundle["maintenance"]["reason"] = reason + f" Retain the {phrase}."
          bundle_path.write_text(json.dumps(bundle, indent=2) + "\n", encoding="utf-8")

          workflow = Path(".github/workflows/alpha931-bookkeeping.yml")
          workflow.unlink()

          print("Updated current-release guards:")
          for path in changed:
              print(f"- {path}")
          PY

      - name: Commit aligned release guards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align Alpha9.31 release guards"
          git push origin HEAD:fix/alpha9.31-foxess-static-freshness
