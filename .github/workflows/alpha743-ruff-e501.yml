name: Alpha7.43 temporary E501 fix

on:
  push:
    branches:
      - feature/alpha743-power-down-happy-hour
    paths:
      - ".github/workflows/alpha743-ruff-e501.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha743-power-down-happy-hour
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1 ruff==0.16.0
      - name: Put file-level E501 exception outside docstring
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/kems/agile_alpha743_event_priority.py")
          text = path.read_text()
          text = text.replace("\n# ruff: noqa: E501\n", "\n", 1)
          needle = 'This remains simulation/shadow only.  No FoxESS write path is introduced.\n"""\n\nfrom __future__ import annotations'
          replacement = 'This remains simulation/shadow only.  No FoxESS write path is introduced.\n"""\n\n# ruff: noqa: E501\n\nfrom __future__ import annotations'
          if needle not in text:
              raise SystemExit("Alpha7.43 module docstring marker not found")
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          python -m black custom_components/kems/agile_alpha743_event_priority.py
          python -m ruff check custom_components/kems/agile_alpha743_event_priority.py custom_components/kems/happy_hour.py
          git rm .github/workflows/alpha743-ruff-e501.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- custom_components/kems/agile_alpha743_event_priority.py
          git commit -m "Place Alpha7.43 Ruff exception correctly"
          git push origin HEAD:feature/alpha743-power-down-happy-hour
