name: Fix unified update formatting once

on:
  push:
    branches:
      - feature/unified-update-orchestrator
    paths:
      - .github/workflows/fix-unified-update-format-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-update-orchestrator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tighten required-component verification
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('custom_components/kems/update_orchestrator.py')
          text = path.read_text(encoding='utf-8')
          old = 'item.status in {"current", "not-targeted", "not-installed"}\n            for item in local_required'
          new = 'item.status in {"current", "not-targeted"}\n            for item in local_required'
          if old not in text:
              raise SystemExit('verification anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install Black
        run: python -m pip install black==26.5.1
      - name: Format changed Python
        run: python -m black custom_components/kems/update_orchestrator.py custom_components/kems/time.py scripts/render_update_bundle.py tests/test_update_orchestrator.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-unified-update-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format and tighten coordinated update verification"
          git push
