name: Temporary patch coordinated update guard

on:
  push:
    branches:
      - fix/update-downgrade-guard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-downgrade-guard
      - name: Patch updater and bump bootstrap test release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/kems/update_orchestrator.py')
          text = path.read_text(encoding='utf-8')

          old = 'from .entity import KEMSEntity\n'
          new = (
              'from .entity import KEMSEntity\n'
              'from .versioning import version_is_newer, version_relation\n'
          )
          assert old in text and 'from .versioning import' not in text
          text = text.replace(old, new, 1)

          old = '''        latest = state.attributes.get("latest_version")
                  installed = state.attributes.get("installed_version")
                  if not latest or _version_matches(latest, installed):
                      return None
          '''
          new = '''        latest = state.attributes.get("latest_version")
                  running = _installed_integration_version()
                  if not latest or not version_is_newer(latest, running):
                      return None
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        target = _component_target(bundle, "kems_core")
                  current = _installed_integration_version()
                  if not target or _version_matches(current, target):
                      return
          '''
          new = '''        target = _component_target(bundle, "kems_core")
                  current = _installed_integration_version()
                  if not target or _version_matches(current, target):
                      return
                  relation = version_relation(target, current)
                  if relation is None:
                      LOGGER.warning(
                          "Ignoring KEMS bundle target %s because running version %s "
                          "cannot be safely ordered",
                          target,
                          current,
                      )
                      return
                  if relation < 0:
                      LOGGER.warning(
                          "Ignoring older KEMS bundle target %s because %s is already running",
                          target,
                          current,
                      )
                      return
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        target = self.pending.get("target")
                  core_current = _version_matches(_installed_integration_version(), target)
          '''
          new = '''        target = self.pending.get("target")
                  running = _installed_integration_version()
                  relation = version_relation(target, running)
                  if relation is not None and relation < 0:
                      LOGGER.warning(
                          "Clearing stale KEMS update target %s because %s is already running",
                          target,
                          running,
                      )
                      self.pending = None
                      self.maintenance = {"status": "none"}
                      self.last_error = None
                      if self.hass.services.has_service(
                          "persistent_notification", "dismiss"
                      ):
                          await self.hass.services.async_call(
                              "persistent_notification",
                              "dismiss",
                              {"notification_id": NOTIFICATION_ID},
                              blocking=True,
                          )
                      if save:
                          await self._async_save()
                      self._write_legacy_states()
                      return
                  core_current = _version_matches(running, target)
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        if core_target is None:
                      core_status = "not-targeted"
                  else:
                      core_status = (
                          "current"
                          if _version_matches(running, core_target)
                          else "update-required"
                      )
          '''
          new = '''        if core_target is None:
                      core_status = "not-targeted"
                  elif _version_matches(running, core_target):
                      core_status = "current"
                  else:
                      relation = version_relation(core_target, running)
                      if relation == 1:
                          core_status = "update-required"
                      elif relation == -1:
                          core_status = "ahead-of-target"
                      else:
                          core_status = "version-mismatch"
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            item.status not in {"current", "not-targeted", "not-installed"}
          '''
          new = '''            item.status
                      not in {"current", "not-targeted", "not-installed", "ahead-of-target"}
          '''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          manifest = Path('custom_components/kems/manifest.json')
          manifest_text = manifest.read_text(encoding='utf-8')
          assert '"version": "0.7.0-alpha7"' in manifest_text
          manifest.write_text(
              manifest_text.replace(
                  '"version": "0.7.0-alpha7"',
                  '"version": "0.7.0-alpha7.1"',
                  1,
              ),
              encoding='utf-8',
          )
          PY
      - name: Format changed Python
        run: |
          python -m pip install --quiet black
          python -m black custom_components/kems/update_orchestrator.py custom_components/kems/versioning.py tests/test_update_versioning.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/kems/update_orchestrator.py custom_components/kems/manifest.json custom_components/kems/versioning.py tests/test_update_versioning.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Prevent coordinated update downgrades'
          git push origin HEAD:fix/update-downgrade-guard
