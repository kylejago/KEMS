name: Format PR37 once

on:
  push:
    branches:
      - feature/commissioning-readiness-panel-health

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commissioning-readiness-panel-health
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install formatter
        run: python -m pip install black==26.5.1
      - name: Format new files
        run: python -m black custom_components/kems/commissioning.py custom_components/kems/panel.py tests/test_managed_panel.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/commissioning.py custom_components/kems/panel.py tests/test_managed_panel.py
          git commit -m "Format commissioning readiness changes"
          git push
