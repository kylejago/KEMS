name: Add Full KEMS Forecast dashboard once

on:
  push:
    branches:
      - feature/panel-startup-animation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/panel-startup-animation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Add Full KEMS Forecast view
        run: python scripts/add_full_kems_forecast_dashboard_once.py
      - name: Commit dashboard update
        run: |
          if git diff --quiet; then
            echo "No dashboard changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboards/kems_master_dashboard.yaml custom_components/kems/kems_master_dashboard.yaml tests/test_managed_dashboard.py
          git commit -m "Add Full KEMS Forecast dashboard view"
          git push
