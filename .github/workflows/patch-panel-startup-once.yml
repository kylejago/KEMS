name: Patch panel startup animation once

on:
  push:
    branches:
      - feature/panel-startup-animation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch managed panel and tests
        run: python scripts/patch_panel_startup_animation_once.py
      - name: Commit generated panel update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/kems16x16.yaml tests/test_managed_panel.py
          git commit -m "Add managed panel startup animation"
          git push
