name: Apply Alpha8.57 house-first reconciliation

on:
  push:
    branches:
      - feature/alpha8.57-house-first-reconciliation
    paths:
      - .github/workflows/apply-alpha857.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha8.57-house-first-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply bounded Alpha8.57 patch
        run: python scripts/apply_alpha857.py
      - name: Commit clean candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "KEMS Alpha8.57: enforce canonical house-first discharge"
          git push origin HEAD:feature/alpha8.57-house-first-reconciliation
