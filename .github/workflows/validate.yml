name: Validate

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"

  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff pytest

      - name: Black
        run: black --check .

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest