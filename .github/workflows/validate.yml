name: Validate

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Packaged dashboard is current
        run: python scripts/sync_packaged_dashboard.py --check

      - name: Black
        run: python -m black --check --diff .

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: Compile Python source
        run: python -m compileall -q custom_components tests

  panel-compile:
    name: ESPHome panel compile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          python -m pip install esphome

      - name: Provide CI-only Wi-Fi secrets
        run: |
          cat > custom_components/kems/secrets.yaml <<'EOF'
          wifi_ssid: "KEMS-CI"
          wifi_password: "kems-ci-placeholder"
          EOF

      - name: Render runtime managed panel
        run: python scripts/render_managed_panel.py

      - name: Validate managed panel configuration
        run: esphome config custom_components/kems/kems16x16-ci.yaml

      - name: Compile managed panel firmware
        run: esphome compile custom_components/kems/kems16x16-ci.yaml

  alpha941-identity:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'fix/alpha9.41-no-export-simulation-authority' &&
      github.event.head_commit.message == 'chore: bootstrap Alpha9.41 release identity'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha9.41-no-export-simulation-authority
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare Alpha9.41 identity
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "0.9.0-alpha9.40"
          new = "0.9.0-alpha9.41"
          targets = [
              "custom_components/kems/manifest.json",
              "tests/test_alpha8_consolidation.py",
              "tests/test_alpha913_forecast_path_scheduler.py",
              "tests/test_alpha919_runtime_recorder_owner.py",
              "tests/test_alpha920_shadow_recorder_owner.py",
              "tests/test_alpha921_planning_target_house_floor.py",
              "tests/test_alpha922_flow_contract_startup.py",
              "tests/test_alpha924_flow_parity_export_floor.py",
              "tests/test_alpha925_observability_clarity.py",
              "tests/test_alpha926_panel_layout_profiles.py",
              "tests/test_alpha927_policy_label_publication.py",
              "tests/test_alpha928_panel_v2_staggered_flow.py",
              "tests/test_alpha929_panel_v2_extra_gap.py",
              "tests/test_alpha930_live_foxess_solar_commissioning.py",
              "tests/test_alpha937_dashboard_contract.py",
              "tests/test_alpha9_baseline.py",
          ]
          for name in targets:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected exactly one {old!r}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          bundle = Path("release/kems-bundle.template.json")
          text = bundle.read_text(encoding="utf-8")
          marker = '    "reason": "'
          if text.count(marker) != 1:
              raise SystemExit("release reason marker is not unique")
          reason = (
              "Alpha9.41 restores export-policy authority to the main KEMS digital twin. "
              "When No paid export is active, the policy-aware SimulationEngine replay now "
              "remains authoritative for cumulative SOC, energy and financial totals instead "
              "of being overwritten by the separate paid-export Agile Smart Export ledger; "
              "the final canonical KEMS routing snapshot remains authoritative for instantaneous "
              "simulated power. Paid-export mode retains the Alpha9.39 current-day Full KEMS "
              "authority unchanged. This fixes the live Alpha9.40 contradiction where no-export "
              "mode reported paid battery export and export income. Alpha9.41 changes presentation/"
              "accounting authority only: no optimiser allocation, tariff selection, Happy Hour, "
              "Power Down, commissioning, control eligibility or FoxESS hardware-write authority changes. "
          )
          bundle.write_text(text.replace(marker, marker + reason, 1), encoding="utf-8")
          PY

      - name: Restore normal validation workflow
        run: git checkout origin/main -- .github/workflows/validate.yml

      - name: Commit Alpha9.41 identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/manifest.json release/kems-bundle.template.json tests .github/workflows/validate.yml
          git diff --cached --check
          git commit -m "release: prepare Alpha9.41 identity"
          git push origin HEAD:fix/alpha9.41-no-export-simulation-authority
