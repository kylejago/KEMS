name: Validate

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply one-shot forecast validation sensor patch
        run: |
          python scripts/apply_alpha7_sensor_patch.py
          python -m black custom_components/kems/sensor.py custom_components/kems/kems_core/models.py

      - name: Commit generated patch when required
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated patch already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/kems/sensor.py custom_components/kems/kems_core/models.py
            git commit -m "Expose forecast validation sensors [alpha7-generated]"
            git push
          fi

      - name: Black
        run: python -m black --check .

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: Compile Python source
        run: python -m compileall -q custom_components tests
