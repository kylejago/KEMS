name: Validate

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"
  pull_request:

permissions:
  contents: write

jobs:
  alpha926-builder:
    if: >-
      github.ref == 'refs/heads/feature/alpha9.26-panel-layout-profiles' &&
      !contains(github.event.head_commit.message, 'Alpha9.26: add selectable V1/V2 panel profiles')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha9.26-panel-layout-profiles
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply deterministic branch implementation
        run: python scripts/tmp_alpha926_apply.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems dashboards/kems_master_dashboard.yaml release/kems-bundle.template.json tests/test_managed_panel.py
          git diff --cached --check
          git commit -m "Alpha9.26: add selectable V1/V2 panel profiles"
          git push origin HEAD:feature/alpha9.26-panel-layout-profiles

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Packaged dashboard is current
        run: python scripts/sync_packaged_dashboard.py --check

      - name: Black
        run: python -m black --check --diff .

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: Compile Python source
        run: python -m compileall -q custom_components tests

  panel-compile:
    name: ESPHome panel compile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          python -m pip install esphome

      - name: Provide CI-only Wi-Fi secrets
        run: |
          cat > custom_components/kems/secrets.yaml <<'EOF'
          wifi_ssid: "KEMS-CI"
          wifi_password: "kems-ci-placeholder"
          EOF

      - name: Render runtime managed panel
        run: python scripts/render_managed_panel.py

      - name: Validate managed panel configuration
        run: esphome config custom_components/kems/kems16x16-ci.yaml

      - name: Compile managed panel firmware
        run: esphome compile custom_components/kems/kems16x16-ci.yaml