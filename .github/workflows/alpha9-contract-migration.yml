name: Alpha9 historical contract migration

on:
  push:
    branches:
      - release/alpha9.0-coordinated-baseline
    paths:
      - '.github/workflows/alpha9-contract-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/alpha9.0-coordinated-baseline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Migrate Alpha8 release metadata assertions across generation reset
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          TESTS = Path('tests')
          changed = []

          def main_source(path: Path) -> str:
              result = subprocess.run(
                  ['git', 'show', f'origin/main:{path.as_posix()}'],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              return result.stdout if result.returncode == 0 else ''

          for path in sorted(TESTS.glob('*.py')):
              source = path.read_text(encoding='utf-8')
              updated = source

              # Text-form checks against the live manifest must accept the Alpha9
              # generation reset while still proving that the historical module is
              # packaged in the current integration.
              updated = updated.replace(
                  "assert '\"version\": \"0.8.0-alpha8.' in manifest",
                  "assert any(marker in manifest for marker in ('\"version\": \"0.8.0-alpha8.', '\"version\": \"0.9.0-alpha9.'))",
              )

              # A new generation legitimately resets its release counter to .0.
              # Old milestone tests keep their Alpha8 numeric floor when running on
              # Alpha8, but Alpha9 itself is already a successor to every Alpha8.x.
              updated = re.sub(
                  r'(?m)^(\s*)assert int\(version\.rsplit\("\\\.", 1\)\[(-?1|1)\]\) >= (\d+)\s*$',
                  lambda m: f'{m.group(1)}assert version.startswith("0.9.0-alpha9.") or int(version.rsplit(".", 1)[{m.group(2)}]) >= {m.group(3)}',
                  updated,
              )
              updated = re.sub(
                  r'(?m)^(\s*)assert int\(manifest\["version"\]\.rsplit\("\\\.", 1\)\[(-?1|1)\]\) >= (\d+)\s*$',
                  lambda m: f'{m.group(1)}assert str(manifest["version"]).startswith("0.9.0-alpha9.") or int(manifest["version"].rsplit(".", 1)[{m.group(2)}]) >= {m.group(3)}',
                  updated,
              )
              updated = re.sub(
                  r'(?m)^(\s*)assert int\(str\(manifest\["version"\]\)\.rsplit\("\\\.", 1\)\[(-?1|1)\]\) >= (\d+)\s*$',
                  lambda m: f'{m.group(1)}assert str(manifest["version"]).startswith("0.9.0-alpha9.") or int(str(manifest["version"]).rsplit(".", 1)[{m.group(2)}]) >= {m.group(3)}',
                  updated,
              )
              updated = re.sub(
                  r'(?m)^(\s*)assert int\(version\.removeprefix\(prefix\)\) >= (\d+)\s*$',
                  lambda m: f'{m.group(1)}assert version.startswith("0.9.0-alpha9.") or int(version.removeprefix(prefix)) >= {m.group(2)}',
                  updated,
              )
              updated = re.sub(
                  r'(?m)^(\s*)assert release_number >= (\d+)\s*$',
                  lambda m: f'{m.group(1)}assert version.startswith("0.9.0-alpha9.") or release_number >= {m.group(2)}',
                  updated,
              )

              # Property Web and the Pi agent remain one version track. Public Web
              # becomes independent in Alpha9, so old three-way equality checks must
              # accept the intentional split rather than forcing version coupling.
              updated = updated.replace(
                  'assert property_web == pi_agent == public_web',
                  'assert property_web == pi_agent\n    assert public_web == property_web or public_web.startswith("0.9.0-alpha9-public.")',
              )
              updated = updated.replace(
                  'assert property_web == pi_agent == public_web == "0.8.0-alpha8-web.9"',
                  'assert property_web == pi_agent\n    assert property_web.startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web."))\n    assert public_web == property_web or public_web.startswith("0.9.0-alpha9-public.")',
              )
              updated = updated.replace(
                  'assert len(web_versions) == 1',
                  'assert len(web_versions) == 1 or web_versions == {"0.9.0-alpha9-web.0", "0.9.0-alpha9-public.0"}',
              )
              updated = updated.replace(
                  'web_version = web_versions.pop()',
                  'web_version = str(bundle["components"]["property_web"]["version"])',
              )
              updated = updated.replace(
                  'next(iter(web_versions)).startswith("0.8.0-alpha8-web.")',
                  'str(bundle["components"]["property_web"]["version"]).startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web."))',
              )
              updated = updated.replace(
                  'web_version.startswith("0.8.0-alpha8-web.")',
                  'web_version.startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web."))',
              )

              # Direct current-bundle assertions from old tests are compatibility
              # assertions now. The dedicated Alpha9 baseline test owns exact pins.
              for component in ('property_web', 'pi_agent'):
                  updated = re.sub(
                      rf'assert bundle\["components"\]\["{component}"\]\["version"\] == "0\.8\.0-alpha8-web\.\d+"',
                      f'assert str(bundle["components"]["{component}"]["version"]).startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web."))',
                      updated,
                  )
              updated = re.sub(
                  r'assert bundle\["components"\]\["public_web"\]\["version"\] == "0\.8\.0-alpha8-web\.\d+"',
                  'assert str(bundle["components"]["public_web"]["version"]).startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-public."))',
                  updated,
              )

              # If the failed first migration altered an assertion about immutable
              # historical release-note text, restore that assertion from main. Do
              # not rewrite current bundle/panel assertions.
              baseline = main_source(path)
              for var in ('text', 'notes'):
                  current_pat = re.compile(
                      rf'(?m)^\s*assert "0\.9\.0-alpha9-panel\.0([^"\n]*)" in {var}\s*$'
                  )
                  main_pat = re.compile(
                      rf'(?m)^(\s*assert "0\.8\.0-alpha8-panel\.[^"\n]*" in {var}\s*)$'
                  )
                  if current_pat.search(updated):
                      match = main_pat.search(baseline)
                      if match:
                          updated = current_pat.sub(match.group(1), updated)

              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          print(f'Migrated {len(changed)} test files')
          for item in changed:
              print(item)
          PY

      - name: Format and validate migrated suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m black tests
          python -m ruff check tests
          python -m pytest

      - name: Commit only after full pytest passes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/alpha9-contract-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/alpha9-contract-migration.yml
          git diff --cached --check
          git commit -m 'Alpha9: make historical release contracts generation-aware'
          git push origin HEAD:release/alpha9.0-coordinated-baseline
