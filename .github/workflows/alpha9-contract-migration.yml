name: Alpha9 historical contract migration

on:
  push:
    branches:
      - release/alpha9.0-coordinated-baseline
    paths:
      - '.github/workflows/alpha9-contract-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/alpha9.0-coordinated-baseline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Migrate historical contracts across the Alpha9 generation reset
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          changed = []

          def main_source(path: Path) -> str:
              result = subprocess.run(
                  ['git', 'show', f'origin/main:{path.as_posix()}'],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              return result.stdout if result.returncode == 0 else ''

          for path in sorted(Path('tests').glob('*.py')):
              source = path.read_text(encoding='utf-8')
              baseline = main_source(path)
              updated = source

              # The first bulk attempt corrupted several immutable release-note
              # expectations. This file is notes-only, so restore its proven main
              # version exactly before doing any successor migration.
              if path.name == 'test_release_notes.py' and baseline:
                  updated = baseline

              # The portable bundle test is about the CURRENT template. Rebase its
              # exact target to Alpha9 instead of rendering an Alpha8 tag through an
              # Alpha9 template.
              if path.name == 'test_update_bundle.py':
                  replacement = '\n'.join([
                      'def test_release_bundle_renders_exact_coordinated_alpha9_targets() -> None:',
                      '    """The current template must render the exact four-track Alpha9 baseline."""',
                      '    bundle = module.render_bundle(TEMPLATE, "v0.9.0-alpha9.0")',
                      '    assert bundle["bundle"] == "0.9.0-alpha9.0"',
                      '    assert bundle["components"]["kems_core"]["version"] == "0.9.0-alpha9.0"',
                      '    assert bundle["components"]["dashboard"]["version"] == "0.9.0-alpha9.0"',
                      '    assert bundle["components"]["panel"]["version"] == "0.9.0-alpha9-panel.0"',
                      '    assert bundle["components"]["property_web"]["version"] == "0.9.0-alpha9-web.0"',
                      '    assert bundle["components"]["pi_agent"]["version"] == "0.9.0-alpha9-web.0"',
                      '    assert bundle["components"]["public_web"]["version"] == "0.9.0-alpha9-public.0"',
                      '    assert bundle["components"]["property_web"]["required"] is True',
                      '    assert bundle["components"]["pi_agent"]["required"] is True',
                      '    assert bundle["components"]["public_web"]["required"] is False',
                      '    assert bundle["components"]["public_web"]["delivery"] == "ionos-sftp"',
                      '',
                      '    affected = bundle["maintenance"]["affected_components"]',
                      '    assert affected == [',
                      '        "kems_core",',
                      '        "dashboard",',
                      '        "panel",',
                      '        "property_web",',
                      '        "pi_agent",',
                      '        "public_web",',
                      '    ]',
                      '    assert bundle["maintenance"]["reboot_required"] is False',
                      '    reason = bundle["maintenance"]["reason"]',
                      '    assert "Alpha9 coordinated parity baseline" in reason',
                      '    assert "0.9.0-alpha9-web.0" in reason',
                      '    assert "0.9.0-alpha9-public.0" in reason',
                      '    assert "0.9.0-alpha9-panel.0" in reason',
                      '    assert "hardware writes hard-blocked" in reason',
                      '',
                      '',
                      'def test_bundle_contract_rejects_mismatched_appliance_versions() -> None:',
                  ])
                  updated = re.sub(
                      r'def test_release_bundle_renders_exact_coordinated_alpha8_targets\(\) -> None:\n.*?\n\ndef test_bundle_contract_rejects_mismatched_appliance_versions\(\) -> None:',
                      replacement,
                      updated,
                      count=1,
                      flags=re.S,
                  )

              # Text-form current-manifest checks are generation-aware.
              updated = updated.replace(
                  "assert '\"version\": \"0.8.0-alpha8.' in manifest",
                  "assert any(marker in manifest for marker in ('\"version\": \"0.8.0-alpha8.', '\"version\": \"0.9.0-alpha9.'))",
              )

              # Current release-family prefixes. Alpha9 resets counters and Public
              # Web now has its own release family.
              updated = updated.replace(
                  '.startswith("0.8.0-alpha8-web.")',
                  '.startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web.", "0.9.0-alpha9-public."))',
              )

              # Convert direct numeric milestone assertions line-by-line. Alpha8
              # retains its historical minimum; Alpha9 is already the successor.
              migrated_lines = []
              for line in updated.splitlines():
                  match = re.match(r'^(\s*)assert int\((.+)\) >= (\d+)\s*$', line)
                  if match:
                      indent, expr, minimum = match.groups()
                      if 'property_web' in expr:
                          line = f'{indent}assert property_web.startswith("0.9.0-alpha9-web.") or int({expr}) >= {minimum}'
                      elif 'web_version' in expr:
                          line = f'{indent}assert web_version.startswith("0.9.0-alpha9-web.") or int({expr}) >= {minimum}'
                      elif 'manifest["version"]' in expr:
                          line = f'{indent}assert str(manifest["version"]).startswith("0.9.0-alpha9") or int({expr}) >= {minimum}'
                      elif re.search(r'\bversion\b', expr):
                          line = f'{indent}assert str(version).startswith("0.9.0-alpha9") or int({expr}) >= {minimum}'
                  match_release = re.match(r'^(\s*)assert release_number >= (\d+)\s*$', line)
                  if match_release:
                      indent, minimum = match_release.groups()
                      line = f'{indent}assert str(version).startswith("0.9.0-alpha9") or release_number >= {minimum}'
                  migrated_lines.append(line)
              updated = '\n'.join(migrated_lines) + ('\n' if updated.endswith('\n') else '')

              # Exact old three-way coupling first, then generic equality. Property
              # Web + Pi remain coupled; Public Web may be independently versioned.
              updated = updated.replace(
                  'assert property_web == pi_agent == public_web == "0.8.0-alpha8-web.9"',
                  'assert property_web == pi_agent\n    assert property_web.startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web."))\n    assert public_web == property_web or public_web.startswith("0.9.0-alpha9-public.")',
              )
              updated = updated.replace(
                  'assert property_web == pi_agent == public_web',
                  'assert property_web == pi_agent\n    assert public_web == property_web or public_web.startswith("0.9.0-alpha9-public.")',
              )
              updated = updated.replace(
                  'assert property_web.startswith("0.8.0-alpha8-web.")',
                  'assert property_web.startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web."))',
              )

              updated = updated.replace(
                  'assert len(web_versions) == 1',
                  'assert len(web_versions) == 1 or web_versions == {"0.9.0-alpha9-web.0", "0.9.0-alpha9-public.0"}',
              )
              updated = updated.replace(
                  'web_version = web_versions.pop()',
                  'web_version = str(bundle["components"]["property_web"]["version"])',
              )
              updated = updated.replace(
                  'next(iter(web_versions)).startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web.", "0.9.0-alpha9-public."))',
                  'str(bundle["components"]["property_web"]["version"]).startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web."))',
              )

              # Direct current-bundle pins from historical tests are compatibility
              # assertions. test_alpha9_baseline.py owns the exact current pins.
              for component in ('property_web', 'pi_agent'):
                  updated = re.sub(
                      rf'assert bundle\["components"\]\["{component}"\]\["version"\] == "0\.8\.0-alpha8-web\.\d+"',
                      f'assert str(bundle["components"]["{component}"]["version"]).startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web."))',
                      updated,
                  )
              updated = re.sub(
                  r'assert bundle\["components"\]\["public_web"\]\["version"\] == "0\.8\.0-alpha8-web\.\d+"',
                  'assert str(bundle["components"]["public_web"]["version"]).startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-public."))',
                  updated,
              )
              updated = updated.replace(
                  'assert bundle["components"][key]["version"] == "0.8.0-alpha8-web.9"',
                  'assert str(bundle["components"][key]["version"]).startswith(("0.8.0-alpha8-web.", "0.9.0-alpha9-web.", "0.9.0-alpha9-public."))',
              )

              # Old Alpha8 core/dashboard-only maintenance scopes remain valid
              # historically; the coordinated Alpha9 baseline intentionally covers
              # all four tracks. Handle both compact and Black-formatted multiline
              # forms of the old assertion.
              updated = updated.replace(
                  'assert bundle["maintenance"]["affected_components"] == ["kems_core", "dashboard"]',
                  'assert bundle["maintenance"]["affected_components"] in (["kems_core", "dashboard"], ["kems_core", "dashboard", "panel", "property_web", "pi_agent", "public_web"])',
              )
              updated = re.sub(
                  r'assert bundle\["maintenance"\]\["affected_components"\] == \[\s*"kems_core",\s*"dashboard",?\s*\]',
                  'assert bundle["maintenance"]["affected_components"] in (["kems_core", "dashboard"], ["kems_core", "dashboard", "panel", "property_web", "pi_agent", "public_web"])',
                  updated,
              )

              # In files that mix current bundle assertions with immutable release
              # notes, restore the note-specific panel assertion from main.
              if path.name in {'test_alpha8_8_release.py', 'test_alpha8_9_release.py', 'test_alpha8_10_release.py'} and baseline:
                  main_note = re.search(
                      r'(?m)^(\s*assert "0\.8\.0-alpha8-panel\.[^"\n]*" in (?:text|notes)\s*)$',
                      baseline,
                  )
                  if main_note:
                      updated = re.sub(
                          r'(?m)^\s*assert "0\.9\.0-alpha9-panel\.0[^"\n]*" in (?:text|notes)\s*$',
                          main_note.group(1),
                          updated,
                      )

              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          print(f'Migrated {len(changed)} test files')
          for item in changed:
              print(item)
          PY

      - name: Format and validate migrated suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m black tests
          python -m ruff check tests
          python -m pytest

      - name: Commit only after full pytest passes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/alpha9-contract-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/alpha9-contract-migration.yml
          git diff --cached --check
          git commit -m 'Alpha9: make historical release contracts generation-aware'
          git push origin HEAD:release/alpha9.0-coordinated-baseline
