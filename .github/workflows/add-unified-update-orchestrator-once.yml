name: Add unified update orchestrator once

on:
  push:
    branches:
      - feature/unified-update-orchestrator
    paths:
      - scripts/add_unified_update_orchestrator_once.py
      - .github/workflows/add-unified-update-orchestrator-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-update-orchestrator
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply integration patch
        run: python scripts/add_unified_update_orchestrator_once.py
      - name: Compile KEMS
        run: python -m compileall custom_components/kems
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Wire coordinated updates into Home Assistant"
          git push
