name: Alpha9.25 Ruff report

on:
  push:
    branches:
      - fix/alpha9.25-observability-clarity

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha9.25-observability-clarity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.0
      - name: Capture Ruff diagnostics
        run: python -m ruff check . > alpha925-ruff-report.txt 2>&1 || true
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha925-ruff-report.txt
          git commit -m 'ci: capture Alpha9.25 Ruff diagnostics'
          git push origin HEAD:fix/alpha9.25-observability-clarity
