name: Alpha9.44 dashboard bootstrap

on:
  push:
    branches:
      - "fix/alpha9.44-happy-hour-dashboard"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/alpha9.44-happy-hour-dashboard"
          fetch-depth: 0

      - name: Apply Alpha9.44 dashboard and release identity
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/alpha944.py
          python /tmp/alpha944.py

      - name: Commit generated candidate and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/alpha944-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Alpha9.44: surface Weekend Happy Hour planner"
          git push origin HEAD:fix/alpha9.44-happy-hour-dashboard
