name: Alpha7.36 Black formatter

on:
  push:
    branches:
      - feature/alpha7.36-panel6-simple-modes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha7.36-panel6-simple-modes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1
      - name: Apply pinned Black
        run: |
          python -m black \
            custom_components/kems/agile_alpha736_panel_flow.py \
            custom_components/kems/dashboard_alpha736_finance.py \
            tests/test_alpha736_panel_finance.py \
            tests/test_managed_panel.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/agile_alpha736_panel_flow.py \
                  custom_components/kems/dashboard_alpha736_finance.py \
                  tests/test_alpha736_panel_finance.py \
                  tests/test_managed_panel.py
          git commit -m "Apply Black to Alpha7.36 files"
          git push origin HEAD:feature/alpha7.36-panel6-simple-modes
