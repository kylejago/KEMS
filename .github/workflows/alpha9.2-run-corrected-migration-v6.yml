name: Alpha9.2 contract-aligned gated candidate

on:
  push:
    branches:
      - feature/alpha9.2-happy-hour-hourly-cap-ohme
    paths:
      - .github/workflows/alpha9.2-run-corrected-migration-v6.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha9.2-happy-hour-hourly-cap-ohme
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Rebuild exact v5 candidate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          lines = Path(
              '.github/workflows/alpha9.2-run-corrected-migration-v5.yml'
          ).read_text(encoding='utf-8').splitlines()
          scripts = []
          index = 0
          while index < len(lines):
              if lines[index].strip() != "python <<'PY'":
                  index += 1
                  continue
              start = index + 1
              end = next(
                  pos for pos in range(start, len(lines)) if lines[pos].strip() == 'PY'
              )
              scripts.append(
                  '\n'.join(
                      line[10:] if line.startswith('          ') else line
                      for line in lines[start:end]
                  )
                  + '\n'
              )
              index = end + 1
          if len(scripts) < 2:
              raise SystemExit(f'expected two v5 staging scripts, found {len(scripts)}')
          for number, script in enumerate(scripts[:2], start=1):
              exec(
                  compile(script, f'<alpha9.2-v5-stage-{number}>', 'exec'),
                  {'__name__': '__main__'},
              )
          PY

      - name: Align Alpha9.2 release and narrow-write contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(
                      f'{target}: expected one occurrence, found {text.count(old)} for {old!r}'
                  )
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/test_alpha8_consolidation.py',
              '    assert manifest["version"] == "0.9.0-alpha9.1"\n',
              '    assert manifest["version"] == "0.9.0-alpha9.2"\n',
          )

          replace_once(
              'tests/test_alpha9_2_happy_hour.py',
              '    assert \'"select",\\n                "select_option"\' in source\n',
              '    assert source.count("self._hass.services.async_call(") == 1\n'
              '    call_start = source.index("self._hass.services.async_call(")\n'
              '    call_block = source[call_start : call_start + 300]\n'
              '    assert \'"select"\' in call_block\n'
              '    assert \'"select_option"\' in call_block\n',
          )
          PY

      - name: Format generated candidate
        run: |
          python -m ruff check --fix \
            custom_components/kems/happy_hour_budget.py \
            custom_components/kems/happy_hour_ohme_control.py \
            custom_components/kems/coordinator.py \
            tests/test_alpha8_consolidation.py \
            tests/test_alpha9_2_happy_hour.py
          python -m black \
            custom_components/kems/happy_hour_budget.py \
            custom_components/kems/happy_hour_ohme_control.py \
            custom_components/kems/const.py \
            custom_components/kems/agile_alpha7_compat.py \
            custom_components/kems/agile_control_alignment.py \
            custom_components/kems/kems_core/ev_charge_policy.py \
            custom_components/kems/ev_policy_dashboard.py \
            custom_components/kems/switch.py \
            custom_components/kems/happy_hour_auto.py \
            custom_components/kems/coordinator.py \
            custom_components/kems/diagnostics.py \
            custom_components/kems/__init__.py \
            tests/test_ev_charge_policy.py \
            tests/test_alpha8_consolidation.py \
            tests/test_alpha9_baseline.py \
            tests/test_alpha9_2_happy_hour.py
          python scripts/sync_packaged_dashboard.py

      - name: Packaged dashboard is current
        run: python scripts/sync_packaged_dashboard.py --check

      - name: Black
        run: python -m black --check --diff .

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: Compile Python source
        run: python -m compileall -q custom_components tests

      - name: Commit product files only after complete green gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m "Alpha9.2: enforce hourly Happy Hour cap and opt-in Ohme control"
          git push origin HEAD:feature/alpha9.2-happy-hour-hourly-cap-ohme
