name: Apply Alpha8.56 precision patch

on:
  push:
    branches:
      - feature/alpha8.56-grid-precision

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run Alpha8.56 patch helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha8.56-grid-precision
      - name: Apply bounded Alpha8.56 changes
        run: python scripts/apply_alpha856.py
      - name: Commit clean candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'KEMS Alpha8.56: close quantisation grid residual'
          git push origin HEAD:feature/alpha8.56-grid-precision
