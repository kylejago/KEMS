name: Alpha7.35 temporary dashboard audit

on:
  push:
    branches:
      - feature/alpha7.35-product-types-dashboard

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha7.35-product-types-dashboard
      - name: Apply verified entity replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('custom_components/kems/dashboard_consolidation.py')
          text = path.read_text()
          text = text.replace('          - sensor.kems_current_export_rate\n', '')
          text = text.replace(
              '              - sensor.kems_ev_status\n              - sensor.kems_ev_charging_power\n',
              '              - binary_sensor.kems_ev_connected\n              - binary_sensor.kems_ev_charging\n              - sensor.kems_ev_charging_power\n              - sensor.kems_ev_state_of_charge\n',
          )
          text = text.replace('              - sensor.kems_agile_rolling_next_export_slot\n', '')
          text = text.replace('              - sensor.kems_agile_rolling_capacity_margin\n', '')
          text = text.replace(
              "          | Solar export kW | {{ states('sensor.kems_grid_export') }} |",
              '          | Solar export kW | — |',
          )
          path.write_text(text)
          PY
      - name: Commit audited dashboard
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/dashboard_consolidation.py
          git commit -m "Audit Alpha7.35 dashboard entity references"
          git push origin HEAD:feature/alpha7.35-product-types-dashboard
