name: Format update bundle test once

on:
  push:
    branches:
      - feature/unified-update-orchestrator
    paths:
      - .github/workflows/format-update-bundle-test-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-update-orchestrator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1
      - run: python -m black tests/test_update_bundle.py
      - name: Remove helper and commit
        run: |
          rm .github/workflows/format-update-bundle-test-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format coordinated bundle regression test"
          git push
