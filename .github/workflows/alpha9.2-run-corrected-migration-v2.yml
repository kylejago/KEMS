name: Alpha9.2 tightened gated candidate

on:
  push:
    branches:
      - feature/alpha9.2-happy-hour-hourly-cap-ohme
    paths:
      - .github/workflows/alpha9.2-run-corrected-migration-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha9.2-happy-hour-hourly-cap-ohme
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply Alpha9.2 candidate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/alpha9.2-happy-hour-control-migration.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ) + '\n'
          broken = r"h  \\n          **Automatic source:**"
          fixed = r"h  \n          **Automatic source:**"
          if script.count(broken) != 1:
              raise SystemExit(f'expected one escaped Happy Hour marker, found {script.count(broken)}')
          script = script.replace(broken, fixed, 1)
          exec(compile(script, '<alpha9.2-staging>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Tighten generated candidate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{p}: expected one occurrence, found {text.count(old)} for {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Keep the startup log lint-clean.
          replace_once(
              'custom_components/kems/__init__.py',
              '        "KEMS initialised; FoxESS writes remain blocked and Happy Hour Ohme control is explicit opt-in"\n',
              '        "KEMS initialised; FoxESS writes remain blocked and Happy Hour "\n        "Ohme control is explicit opt-in"\n',
          )

          # Keep status text readable without relaxing Ruff.
          replace_once(
              'custom_components/kems/happy_hour_budget.py',
              '                "status": "Waiting for a complete reward-hour import ledger — normal tariff logic",\n',
              '                "status": (\n                    "Waiting for a complete reward-hour import ledger — "\n                    "normal tariff logic"\n                ),\n',
          )
          replace_once(
              'custom_components/kems/happy_hour_budget.py',
              '                    f"Reward hour {current[\'index\']} reached 16 kWh — normal tariff logic"\n',
              '                    f"Reward hour {current[\'index\']} reached 16 kWh — "\n                    "normal tariff logic"\n',
          )

          # The narrow write module may document FoxESS, but it must not import/call it.
          for filename in (
              'tests/test_alpha9_2_happy_hour.py',
              'tests/test_alpha9_baseline.py',
          ):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text = text.replace(
                  'assert "foxess" not in source.casefold()',
                  'assert "from .foxess" not in source\n    assert "FoxESSCommand" not in source',
              )
              p.write_text(text, encoding='utf-8')

          # Do not mutate an entity-owned HA state to publish Ohme audit details.
          p = Path('custom_components/kems/happy_hour_ohme_control.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('    def _publish(self, payload: dict[str, Any]) -> None:\n')
          end = text.index('\n    async def async_update(', start)
          replacement = (
              '    def _publish(self, payload: dict[str, Any]) -> None:\n'
              '        """Retain audit state for diagnostics without mutating HA entities."""\n'
              '        self._status = dict(payload)\n'
          )
          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding='utf-8')

          # The dashboard cannot read diagnostics directly; keep the audit in diagnostics.
          p = Path('custom_components/kems/happy_hour_auto.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "          **Ohme control:** {{ state_attr('sensor.kems_agile_happy_hour_plan', 'ohme_control_status') or 'not armed' }}  \\n",
              '',
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Auto-fix safe Ruff issues and format
        run: |
          python -m ruff check --fix \
            custom_components/kems/happy_hour_budget.py \
            custom_components/kems/happy_hour_ohme_control.py \
            custom_components/kems/coordinator.py \
            tests/test_alpha9_2_happy_hour.py
          python -m black \
            custom_components/kems/happy_hour_budget.py \
            custom_components/kems/happy_hour_ohme_control.py \
            custom_components/kems/const.py \
            custom_components/kems/agile_alpha7_compat.py \
            custom_components/kems/agile_control_alignment.py \
            custom_components/kems/kems_core/ev_charge_policy.py \
            custom_components/kems/ev_policy_dashboard.py \
            custom_components/kems/switch.py \
            custom_components/kems/happy_hour_auto.py \
            custom_components/kems/coordinator.py \
            custom_components/kems/diagnostics.py \
            custom_components/kems/__init__.py \
            tests/test_ev_charge_policy.py \
            tests/test_alpha9_baseline.py \
            tests/test_alpha9_2_happy_hour.py
          python scripts/sync_packaged_dashboard.py

      - name: Packaged dashboard is current
        run: python scripts/sync_packaged_dashboard.py --check

      - name: Black
        run: python -m black --check --diff .

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: Compile Python source
        run: python -m compileall -q custom_components tests

      - name: Commit product files only after complete green gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m "Alpha9.2: enforce hourly Happy Hour cap and opt-in Ohme control"
          git push origin HEAD:feature/alpha9.2-happy-hour-hourly-cap-ohme
