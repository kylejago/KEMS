name: Apply Alpha8.55 coordinated patch

on:
  push:
    branches:
      - feature/alpha8.55-routing-economics-shadow-parity
    paths:
      - scripts/apply-alpha855.py
      - .github/workflows/apply-alpha855.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha8.55-routing-economics-shadow-parity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply Alpha8.55 source and regression patch
        run: python scripts/apply-alpha855.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/agile_control_alignment.py \
                  custom_components/kems/agile_smart_export.py \
                  custom_components/kems/kems_core/discharge_slot_ledger.py \
                  custom_components/kems/manifest.json \
                  docs/alpha8.55-release-notes.md \
                  tests/test_alpha855_routing_economics_shadow.py
          if git diff --cached --quiet; then
            echo "No Alpha8.55 changes to commit"
            exit 0
          fi
          git commit -m "fix: enforce Alpha8.55 routing and economic parity"
          git push origin HEAD:feature/alpha8.55-routing-economics-shadow-parity
