name: Feature master autoformat

on:
  push:
    branches:
      - feature/agile-smart-export

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Apply master dashboard Black formatting') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agile-smart-export
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Black
        run: python -m pip install black==26.5.1

      - name: Format Python
        run: python -m black custom_components/kems/dashboard.py tests/test_managed_dashboard.py

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/dashboard.py tests/test_managed_dashboard.py
          git commit -m "Apply master dashboard Black formatting"
          git push origin HEAD:feature/agile-smart-export
