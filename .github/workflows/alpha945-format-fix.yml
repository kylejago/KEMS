name: Alpha9.45 formatting fix

on:
  push:
    branches:
      - fix/alpha9.45-happy-hour-normalisation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha9.45-happy-hour-normalisation
          fetch-depth: 0
      - run: python .github/alpha945_format_fix.py
      - run: |
          rm .github/alpha945_format_fix.py
          rm .github/workflows/alpha945-format-fix.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Alpha9.45: apply Black formatting"
          git push origin HEAD:fix/alpha9.45-happy-hour-normalisation
