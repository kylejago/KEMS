name: Alpha9.37 release guard bump

on:
  push:
    branches:
      - fix/alpha9.37-dashboard-contract

permissions:
  contents: write

jobs:
  advance-guards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: fix/alpha9.37-dashboard-contract
          fetch-depth: 0

      - name: Advance exact release guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              "tests/test_alpha8_consolidation.py",
              "tests/test_alpha913_forecast_path_scheduler.py",
              "tests/test_alpha919_runtime_recorder_owner.py",
              "tests/test_alpha920_shadow_recorder_owner.py",
              "tests/test_alpha921_planning_target_house_floor.py",
              "tests/test_alpha922_flow_contract_startup.py",
              "tests/test_alpha924_flow_parity_export_floor.py",
              "tests/test_alpha925_observability_clarity.py",
              "tests/test_alpha926_panel_layout_profiles.py",
              "tests/test_alpha927_policy_label_publication.py",
              "tests/test_alpha928_panel_v2_staggered_flow.py",
              "tests/test_alpha929_panel_v2_extra_gap.py",
              "tests/test_alpha930_live_foxess_solar_commissioning.py",
              "tests/test_alpha9_baseline.py",
          ]
          old = "0.9.0-alpha9.36"
          new = "0.9.0-alpha9.37"
          for name in files:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected release guard missing from {name}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Remove one-shot workflow and push guard commit
        shell: bash
        run: |
          git rm .github/workflows/alpha937-version-guards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Alpha9.37: advance release guards"
          git push origin HEAD:fix/alpha9.37-dashboard-contract
