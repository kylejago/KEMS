name: Fix PR37 Ruff once

on:
  push:
    branches:
      - feature/commissioning-readiness-panel-health

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commissioning-readiness-panel-health
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply line-length fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/kems/commissioning.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "            f\"Using {platform or 'unknown'} fallback: {entity_id}; waiting for FoxESS Modbus\",\n":
                  "            (\n                f\"Using {platform or 'unknown'} fallback: {entity_id}; \"\n                \"waiting for FoxESS Modbus\"\n            ),\n",
              "            f\"{data.quality.score:.0f}% quality; {len(data.quality.stale_fields)} stale field(s)\",\n":
                  "            (\n                f\"{data.quality.score:.0f}% quality; \"\n                f\"{len(data.quality.stale_fields)} stale field(s)\"\n            ),\n",
              "                f\"inverter={limits['inverter_limit_kw']} kW; charge={limits['battery_charge_limit_kw']} kW; \"\n                f\"discharge={limits['battery_discharge_limit_kw']} kW; export={limits['export_limit_kw']} kW\"\n":
                  "                f\"inverter={limits['inverter_limit_kw']} kW; \"\n                f\"charge={limits['battery_charge_limit_kw']} kW; \"\n                f\"discharge={limits['battery_discharge_limit_kw']} kW; \"\n                f\"export={limits['export_limit_kw']} kW\"\n",
              "                f\"preflight={data.control.preflight_passed}/{data.control.preflight_total}; \"\n":
                  "                f\"preflight={data.control.preflight_passed}/\"\n                f\"{data.control.preflight_total}; \"\n",
              "                f\"reported={panel['reported_version']}; expected={PANEL_CONFIG_VERSION}; status={panel['status']}\"\n":
                  "                f\"reported={panel['reported_version']}; \"\n                f\"expected={PANEL_CONFIG_VERSION}; \"\n                f\"status={panel['status']}\"\n",
              "        \"configured_battery_power_positive_is_discharge\": configured_positive_is_discharge,\n":
                  "        \"configured_battery_power_positive_is_discharge\": (\n            configured_positive_is_discharge\n        ),\n",
              "            \"desired_battery_to_home_power_kw\": data.control.desired_battery_to_home_power_kw,\n":
                  "            \"desired_battery_to_home_power_kw\": (\n                data.control.desired_battery_to_home_power_kw\n            ),\n",
              "            \"desired_battery_export_power_kw\": data.control.desired_battery_export_power_kw,\n":
                  "            \"desired_battery_export_power_kw\": (\n                data.control.desired_battery_export_power_kw\n            ),\n",
              "            \"desired_total_discharge_power_kw\": data.control.desired_total_discharge_power_kw,\n":
                  "            \"desired_total_discharge_power_kw\": (\n                data.control.desired_total_discharge_power_kw\n            ),\n",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Missing commissioning replacement: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("custom_components/kems/panel.py")
          text = path.read_text(encoding="utf-8")
          old = '        else f"Panel did not report {PANEL_CONFIG_VERSION!r} within {timeout_seconds} seconds"\n'
          new = (
              '        else (\n'
              '            f"Panel did not report {PANEL_CONFIG_VERSION!r} within "\n'
              '            f"{timeout_seconds} seconds"\n'
              '        )\n'
          )
          if old not in text:
              raise SystemExit("Missing panel timeout replacement")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate formatting and lint
        run: |
          python -m pip install black==26.5.1 ruff==0.16.0
          python -m black custom_components/kems/commissioning.py custom_components/kems/panel.py
          python -m ruff check custom_components/kems/commissioning.py custom_components/kems/panel.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kems/commissioning.py custom_components/kems/panel.py
          git commit -m "Fix commissioning readiness lint"
          git push
