name: Alpha9.2 repair staging script

on:
  push:
    branches:
      - feature/alpha9.2-happy-hour-hourly-cap-ohme
    paths:
      - .github/workflows/alpha9.2-repair-staging.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha9.2-happy-hour-hourly-cap-ohme
          fetch-depth: 0

      - name: Repair staging-only assertions and newline marker
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/alpha9.2-happy-hour-control-migration.yml')
          text = path.read_text(encoding='utf-8')

          old = r"h  \\n          **Automatic source:**"
          new = r"h  \n          **Automatic source:**"
          if text.count(old) != 1:
              raise SystemExit(f'expected one escaped Happy Hour marker, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_assert = 'assert "foxess" not in source.casefold()'
          new_assert = 'assert "from .foxess" not in source\n    assert "FoxESSCommand" not in source'
          if text.count(old_assert) != 2:
              raise SystemExit(f'expected two over-broad FoxESS assertions, found {text.count(old_assert)}')
          text = text.replace(old_assert, new_assert)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair and remove this helper
        run: |
          rm .github/workflows/alpha9.2-repair-staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Alpha9.2: repair gated staging script"
          git push origin HEAD:feature/alpha9.2-happy-hour-hourly-cap-ohme
