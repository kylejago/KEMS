name: Alpha9.45 functional bootstrap

on:
  push:
    branches:
      - fix/alpha9.45-happy-hour-normalisation

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha9.45-happy-hour-normalisation
          fetch-depth: 0
      - name: Apply Alpha9.45 functional patch
        run: python .github/alpha945_bootstrap.py
      - name: Remove one-shot bootstrap
        run: |
          rm .github/alpha945_bootstrap.py
          rm .github/workflows/alpha945-bootstrap.yml
      - name: Commit functional candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Alpha9.45: normalise Happy Hour rewards and daily cap"
          git push origin HEAD:fix/alpha9.45-happy-hour-normalisation
