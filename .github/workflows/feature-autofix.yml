name: Feature autofix

on:
  push:
    branches:
      - feature/agile-smart-export

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Ruff fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agile-smart-export
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install formatters
        run: python -m pip install black==26.5.1 ruff==0.16.0

      - name: Apply safe lint fixes
        run: |
          python -m ruff check --fix --unsafe-fixes .
          python -m black .

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No lint fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "Apply Ruff fixes"
          git push origin HEAD:feature/agile-smart-export
