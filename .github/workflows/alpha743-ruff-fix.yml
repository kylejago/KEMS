name: Alpha7.43 temporary Ruff fix

on:
  push:
    branches:
      - feature/alpha743-power-down-happy-hour
    paths:
      - ".github/workflows/alpha743-ruff-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha743-power-down-happy-hour
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1 ruff==0.16.0
      - name: Apply Ruff fixes and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/kems/agile_alpha743_event_priority.py")
          text = path.read_text()
          marker = '"""Alpha7.43 Power Down priority and manual Weekend Happy Hour planning.\n'
          replacement = marker + '\n# ruff: noqa: E501\n'
          if '# ruff: noqa: E501' not in text:
              text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
          python -m ruff check --fix custom_components/kems/happy_hour.py
          python -m black custom_components/kems/agile_alpha743_event_priority.py custom_components/kems/happy_hour.py
          git rm .github/workflows/alpha743-ruff-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- custom_components/kems/agile_alpha743_event_priority.py custom_components/kems/happy_hour.py
          git commit -m "Fix Alpha7.43 Ruff findings"
          git push origin HEAD:feature/alpha743-power-down-happy-hour
