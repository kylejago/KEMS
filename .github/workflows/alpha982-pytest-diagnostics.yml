name: Alpha9.82 temporary pytest diagnostics

on:
  push:
    branches:
      - "fix/alpha9.82-midnight-plan-continuity"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha9.82-midnight-plan-continuity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Capture pytest output
        run: |
          set +e
          python -m pytest -q > alpha982-pytest-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> alpha982-pytest-output.txt
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha982-pytest-output.txt
          git commit -m "Alpha9.82: temporary pytest diagnostic output"
          git push origin HEAD:fix/alpha9.82-midnight-plan-continuity
