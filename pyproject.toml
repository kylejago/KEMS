[project]
name = "kems"
version = "0.1.0"
description = "Kyle Energy Management System"
requires-python = ">=3.14"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]

[tool.pytest.ini_options]
pythonpath = ["custom_components/kems"]
testpaths = ["tests"]
python_files = ["test_*.py"]