[project]
name = "kems"
version = "0.7.0a7"
description = "Kyle Energy Management System"
requires-python = ">=3.13"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"custom_components/kems/agile_alpha726_provisional.py" = ["E501"]
"custom_components/kems/dashboard_alpha740_agile_primary.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
